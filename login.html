<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>User Login | Hakuna Express</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #a0d2eb;
            color: #333;
        }

        header {
            padding: 14px 20px;
            color: white;
            background-color: #5c6bc0;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
        }

        .header-container {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        nav a {
            padding: 8px 10px;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        nav a:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        main {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .login-card {
            width: 100%;
            max-width: 390px;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
        }

        h2 {
            margin-bottom: 22px;
            color: #3f51b5;
            text-align: center;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #bbb;
            border-radius: 5px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #5c6bc0;
            box-shadow: 0 0 0 2px rgba(92, 107, 192, 0.15);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            top: 6px;
            right: 7px;
            padding: 5px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }

        .login-button {
            width: 100%;
            padding: 11px;
            color: white;
            background-color: #5c6bc0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .login-button:hover {
            background-color: #3f51b5;
        }

        .login-button:disabled {
            background-color: #9fa8da;
            cursor: not-allowed;
        }

        .message {
            min-height: 20px;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .error-message {
            color: #d32f2f;
        }

        .success-message {
            color: #2e7d32;
        }

        .signup-text {
            margin-top: 18px;
            text-align: center;
        }

        .signup-text a {
            color: #3f51b5;
            font-weight: bold;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            .header-container {
                flex-direction: column;
            }

            .login-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-container">

        <div class="brand">
            Hakuna Express
        </div>

        <nav>
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="support.html">Support</a>
            <a href="login.html">User Login</a>
            <a href="sign up.html">Sign Up</a>
            <a href="assistant-login.html">
                Assistant Login
            </a>
        </nav>

    </div>
</header>

<main>

    <section class="login-card">

        <h2>User Login</h2>

        <form id="loginForm" novalidate>

            <div class="form-group">
                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="Show or hide password"
                    >
                        👁
                    </button>

                </div>
            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Login
            </button>

        </form>

        <p
            id="loginMessage"
            class="message"
            aria-live="polite"
        ></p>

        <p class="signup-text">
            Don't have an account?
            <a href="sign up.html">
                Sign up
            </a>
        </p>

    </section>

</main>

<script>
    const API_BASE_URL =
        "https://logistics-dwti.onrender.com";

    function showMessage(message, type = "") {
        const element =
            document.getElementById(
                "loginMessage"
            );

        element.textContent = message;
        element.className = "message";

        if (type === "error") {
            element.classList.add(
                "error-message"
            );
        }

        if (type === "success") {
            element.classList.add(
                "success-message"
            );
        }
    }

    document
        .getElementById("togglePassword")
        .addEventListener(
            "click",
            function () {
                const passwordInput =
                    document.getElementById(
                        "password"
                    );

                if (
                    passwordInput.type ===
                    "password"
                ) {
                    passwordInput.type =
                        "text";
                } else {
                    passwordInput.type =
                        "password";
                }
            }
        );

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();

                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;

                const loginButton =
                    document.getElementById(
                        "loginButton"
                    );

                showMessage("");

                if (!email || !password) {
                    showMessage(
                        "Please enter your email and password.",
                        "error"
                    );

                    return;
                }

                loginButton.disabled = true;
                loginButton.textContent =
                    "Logging in...";

                try {
                    const response =
                        await fetch(
                            `${API_BASE_URL}/login`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        email,
                                        password
                                    })
                            }
                        );

                    let data = {};

                    try {
                        data =
                            await response.json();
                    } catch (error) {
                        console.error(
                            "Invalid JSON:",
                            error
                        );
                    }

                    if (!response.ok) {
                        showMessage(
                            data.message ||
                            "Login failed.",
                            "error"
                        );

                        return;
                    }

                    localStorage.removeItem(
                        "assistantToken"
                    );

                    localStorage.removeItem(
                        "assistantName"
                    );

                    localStorage.removeItem(
                        "assistantPhone"
                    );

                    localStorage.setItem(
                        "token",
                        data.token
                    );

                    localStorage.setItem(
                        "userId",
                        data.user?.id || ""
                    );

                    localStorage.setItem(
                        "userName",
                        data.user?.name || ""
                    );

                    localStorage.setItem(
                        "username",
                        data.user?.username || ""
                    );

                    localStorage.setItem(
                        "email",
                        data.user?.email || ""
                    );

                    showMessage(
                        "Login successful.",
                        "success"
                    );

                    setTimeout(
                        function () {
                            window.location.href =
                                "user-dashboard.html";
                        },
                        600
                    );

                } catch (error) {
                    console.error(
                        "Login error:",
                        error
                    );

                    showMessage(
                        "Unable to connect to the server.",
                        "error"
                    );

                } finally {
                    loginButton.disabled = false;
                    loginButton.textContent =
                        "Login";
                }
            }
        );
</script>

</body>
</html>
