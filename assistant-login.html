<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Assistant Login | Hakuna Express</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #a0d2eb;
            color: #333;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 12px 20px;
            color: white;
            background-color: #5c6bc0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            min-height: 50px;
            margin: auto;
        }

        .header-container img {
            width: 110px;
            max-height: 50px;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-links a {
            padding: 9px 12px;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .nav-links a:hover {
            background-color: #8dbed6;
        }

        .login-wrapper {
            min-height: calc(100vh - 74px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.96);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .login-container h2 {
            margin-bottom: 8px;
            color: #3f51b5;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 22px;
            color: #666;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #bbb;
            border-radius: 5px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #5c6bc0;
            box-shadow: 0 0 0 2px rgba(92, 107, 192, 0.15);
        }

        .login-button {
            width: 100%;
            padding: 11px;
            color: white;
            background-color: #5c6bc0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .login-button:hover {
            background-color: #3f51b5;
        }

        .login-button:disabled {
            background-color: #9fa8da;
            cursor: not-allowed;
        }

        .message {
            min-height: 20px;
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
        }

        .error-message {
            color: #d32f2f;
        }

        .success-message {
            color: #2e7d32;
        }

        .phone-help {
            margin-top: 6px;
            color: #666;
            font-size: 12px;
        }

        .user-login-link {
            margin-top: 18px;
            text-align: center;
            color: #555;
            font-size: 14px;
        }

        .user-login-link a {
            color: #3f51b5;
            text-decoration: none;
            font-weight: bold;
        }

        .user-login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 750px) {
            .header-container {
                flex-direction: column;
                gap: 10px;
            }

            .nav-links {
                justify-content: center;
            }

            .nav-links a {
                padding: 7px;
                font-size: 13px;
            }

            .login-wrapper {
                min-height: auto;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-container">

        <img
            src="hakunalogo.jpg"
            alt="Hakuna Express Logo"
        >

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="support.html">Support</a>
            <a href="login.html">User Login</a>
            <a href="signup.html">Sign Up</a>
            <a href="assistant-login.html">Assistant Login</a>
        </nav>

    </div>
</header>

<main class="login-wrapper">

    <section class="login-container">

        <h2>Assistant Login</h2>

        <p class="subtitle">
            Enter the registered phone number assigned by Hakuna Express.
        </p>

        <form id="assistantLoginForm" novalidate>

            <div class="form-group">

                <label for="phone">
                    Registered Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter 10-digit phone number"
                    inputmode="numeric"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    autocomplete="tel"
                    required
                >

                <p class="phone-help">
                    Enter only digits without spaces or country code.
                </p>

            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Login
            </button>

        </form>

        <p
            id="loginMessage"
            class="message"
            aria-live="polite"
        ></p>

        <p class="user-login-link">
            Are you a customer?
            <a href="login.html">User Login</a>
        </p>

    </section>

</main>

<script>
    const API_BASE_URL =
        "https://logistics-dwti.onrender.com";

    function showMessage(message, type) {
        const loginMessage =
            document.getElementById("loginMessage");

        loginMessage.textContent = message;

        loginMessage.className =
            type === "success"
                ? "message success-message"
                : "message error-message";
    }

    function clearUserSession() {
        localStorage.removeItem("token");
        localStorage.removeItem("username");
        localStorage.removeItem("name");
        localStorage.removeItem("currentOrderId");
    }

    function clearAssistantSession() {
        localStorage.removeItem("assistantToken");
        localStorage.removeItem("assistantPhone");
        localStorage.removeItem("assistantName");
        localStorage.removeItem("assistantId");
    }

    document
        .getElementById("phone")
        .addEventListener(
            "input",
            function () {
                this.value =
                    this.value.replace(/\D/g, "");
            }
        );

    document
        .getElementById("assistantLoginForm")
        .addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const loginButton =
                    document.getElementById(
                        "loginButton"
                    );

                const phone =
                    document
                        .getElementById("phone")
                        .value
                        .replace(/\D/g, "");

                showMessage("", "error");

                if (!phone) {
                    showMessage(
                        "Please enter your phone number.",
                        "error"
                    );
                    return;
                }

                if (!/^\d{10}$/.test(phone)) {
                    showMessage(
                        "Phone number must contain exactly 10 digits.",
                        "error"
                    );
                    return;
                }

                loginButton.disabled = true;
                loginButton.textContent =
                    "Logging in...";

                try {
                    const response = await fetch(
                        `${API_BASE_URL}/assistant-login`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                phonenumber: phone
                            })
                        }
                    );

                    const data =
                        await response.json();

                    console.log(
                        "Assistant login response:",
                        data
                    );

                    if (!response.ok) {
                        showMessage(
                            data.message ||
                            "Assistant login failed.",
                            "error"
                        );
                        return;
                    }

                    if (
                        !data.token ||
                        !data.assistant
                    ) {
                        showMessage(
                            "Invalid response from server.",
                            "error"
                        );
                        return;
                    }

                    clearUserSession();
                    clearAssistantSession();

                    localStorage.setItem(
                        "assistantToken",
                        data.token
                    );

                    localStorage.setItem(
                        "assistantPhone",
                        data.assistant.phonenumber ||
                        phone
                    );

                    localStorage.setItem(
                        "assistantName",
                        data.assistant.name || ""
                    );

                    localStorage.setItem(
                        "assistantId",
                        data.assistant.id || ""
                    );

                    showMessage(
                        `Welcome ${
                            data.assistant.name ||
                            "Assistant"
                        }. Redirecting...`,
                        "success"
                    );

                    setTimeout(
                        function () {
                            window.location.href =
                                "assistant-update.html";
                        },
                        1000
                    );

                } catch (error) {
                    console.error(
                        "Assistant login error:",
                        error
                    );

                    showMessage(
                        "Unable to connect to the server. Please try again.",
                        "error"
                    );

                } finally {
                    loginButton.disabled = false;
                    loginButton.textContent =
                        "Login";
                }
            }
        );

    const existingAssistantToken =
        localStorage.getItem("assistantToken");

    if (existingAssistantToken) {
        window.location.href =
            "assistant-update.html";
    }
</script>

</body>
</html>
