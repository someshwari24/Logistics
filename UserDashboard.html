<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>User Dashboard | Hakuna Express</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f7fa;
            color: #333;
        }

        header {
            position: relative;
            background-color: #5c6bc0;
            padding: 18px 80px;
            color: white;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 28px;
        }

        .logout-btn {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            padding: 9px 16px;
            color: white;
            background-color: #d32f2f;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background-color: #b71c1c;
        }

        .dashboard-container {
            width: calc(100% - 30px);
            max-width: 620px;
            margin: 35px auto;
            padding: 28px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .welcome-message {
            margin-bottom: 8px;
            text-align: center;
            color: #3f51b5;
            font-size: 21px;
            font-weight: bold;
        }

        .description {
            margin-bottom: 25px;
            text-align: center;
            color: #666;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #bbb;
            border-radius: 5px;
            outline: none;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #5c6bc0;
            box-shadow: 0 0 0 2px rgba(92, 107, 192, 0.15);
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .button-container {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .button {
            flex: 1;
            padding: 11px 18px;
            color: white;
            background-color: #28a745;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .button:hover {
            background-color: #218838;
        }

        .button:disabled {
            background-color: #94c6a0;
            cursor: not-allowed;
        }

        .cancel-btn {
            background-color: #dc3545;
        }

        .cancel-btn:hover {
            background-color: #c82333;
        }

        .message {
            min-height: 20px;
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .error-message {
            color: #d32f2f;
        }

        .success-message {
            color: #2e7d32;
        }

        .assistant-result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background-color: #edf7ee;
            border: 1px solid #b7d8ba;
            border-radius: 8px;
        }

        .assistant-result h3 {
            margin-bottom: 12px;
            color: #2e7d32;
        }

        .assistant-result p {
            margin: 7px 0;
            line-height: 1.5;
        }

        .assistant-result strong {
            color: #333;
        }

        .result-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .result-link {
            display: inline-block;
            padding: 10px 15px;
            color: white;
            background-color: #25d366;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .result-link:hover {
            background-color: #1da851;
        }

        .secondary-link {
            background-color: #5c6bc0;
        }

        .secondary-link:hover {
            background-color: #3f51b5;
        }

        @media (max-width: 650px) {
            header {
                padding: 18px 15px 70px;
            }

            .logout-btn {
                top: auto;
                right: 50%;
                bottom: 15px;
                transform: translateX(50%);
            }

            .dashboard-container {
                margin: 20px auto;
                padding: 20px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .button-container {
                flex-direction: column;
            }

            .result-actions {
                flex-direction: column;
            }

            .result-link {
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>User Dashboard</h1>

    <button
        type="button"
        class="logout-btn"
        onclick="logout()"
    >
        Logout
    </button>
</header>

<main class="dashboard-container">

    <p class="welcome-message">
        Welcome, <span id="username">User</span>!
    </p>

    <p class="description">
        Enter your shopping details to book a personal shopping assistant.
    </p>

    <form id="shoppingForm" novalidate>

        <div class="form-group">
            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >
        </div>

        <div class="form-group">
            <label for="address">Complete Address</label>

            <textarea
                id="address"
                name="address"
                placeholder="Enter house number, street and locality"
                autocomplete="street-address"
                required
            ></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="city">City</label>

                <input
                    type="text"
                    id="city"
                    name="city"
                    placeholder="Enter city"
                    required
                >
            </div>

            <div class="form-group">
                <label for="state">State</label>

                <input
                    type="text"
                    id="state"
                    name="state"
                    placeholder="Enter state"
                    required
                >
            </div>
        </div>

        <div class="form-group">
            <label for="pincode">Pincode</label>

            <input
                type="text"
                id="pincode"
                name="pincode"
                placeholder="Enter 6-digit pincode"
                inputmode="numeric"
                maxlength="6"
                pattern="[0-9]{6}"
                autocomplete="postal-code"
                required
            >
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="shopping-date">
                    Shopping Date
                </label>

                <input
                    type="date"
                    id="shopping-date"
                    name="date"
                    required
                >
            </div>

            <div class="form-group">
                <label for="shopping-time">
                    Shopping Time
                </label>

                <input
                    type="time"
                    id="shopping-time"
                    name="time"
                    required
                >
            </div>
        </div>

        <div class="form-group">
            <label for="mobile">Mobile Number</label>

            <input
                type="tel"
                id="mobile"
                name="mobile"
                placeholder="Enter 10-digit mobile number"
                inputmode="numeric"
                maxlength="10"
                pattern="[0-9]{10}"
                autocomplete="tel"
                required
            >
        </div>

        <div class="form-group">
            <label for="item">
                Items You Want to Purchase
            </label>

            <textarea
                id="item"
                name="item"
                placeholder="Example: Medicines, groceries, clothes or household products"
                required
            ></textarea>
        </div>

        <div class="form-group">
            <label for="language">
                Preferred Language
            </label>

            <select
                id="language"
                name="language"
                required
            >
                <option value="">
                    Select a language
                </option>

                <option value="English">English</option>
                <option value="Hindi">Hindi</option>
                <option value="Telugu">Telugu</option>
                <option value="Tamil">Tamil</option>
                <option value="Kannada">Kannada</option>
                <option value="Malayalam">Malayalam</option>
                <option value="Marathi">Marathi</option>
                <option value="Bengali">Bengali</option>
                <option value="Gujarati">Gujarati</option>
                <option value="Punjabi">Punjabi</option>
            </select>
        </div>

        <div class="button-container">
            <button
                type="submit"
                class="button"
                id="submitButton"
            >
                Book Assistant
            </button>

            <button
                type="button"
                class="button cancel-btn"
                onclick="cancelForm()"
            >
                Clear Form
            </button>
        </div>
    </form>

    <p
        id="formMessage"
        class="message"
        aria-live="polite"
    ></p>

    <section
        id="assistantResult"
        class="assistant-result"
    >
        <h3>Assistant Assigned Successfully</h3>

        <p>
            <strong>Order ID:</strong>
            <span id="resultOrderId"></span>
        </p>

        <p>
            <strong>Assistant:</strong>
            <span id="resultAssistantName"></span>
        </p>

        <p>
            <strong>Phone:</strong>
            <span id="resultAssistantPhone"></span>
        </p>

        <div class="result-actions">
            <a
                id="whatsappLink"
                class="result-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                Contact on WhatsApp
            </a>

            <a
                href="track order.html"
                class="result-link secondary-link"
            >
                Track Order
            </a>

            <a
                href="confirmation page.html"
                class="result-link secondary-link"
            >
                Confirm Delivery
            </a>
        </div>
    </section>

</main>

<script>
    /*
      Use an empty string when the frontend and backend
      are hosted on the same server.

      For a separate deployed backend, replace it with:
      const API_BASE_URL = "https://your-backend.onrender.com";
    */
    const API_BASE_URL = "";

    const token = localStorage.getItem("token");

    function showMessage(message, type) {
        const formMessage =
            document.getElementById("formMessage");

        formMessage.textContent = message;

        formMessage.className =
            type === "success"
                ? "message success-message"
                : "message error-message";
    }

    function redirectToLogin() {
        localStorage.removeItem("token");
        localStorage.removeItem("username");
        localStorage.removeItem("name");
        localStorage.removeItem("currentOrderId");

        window.location.href = "Login.html";
    }

    async function fetchUserInfo() {
        if (!token) {
            alert("Please log in to access the dashboard.");
            redirectToLogin();
            return;
        }

        try {
            const response = await fetch(
                `${API_BASE_URL}/me`,
                {
                    method: "GET",
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message || "Session expired."
                );
            }

            document.getElementById(
                "username"
            ).textContent = data.name || "User";

            document.getElementById(
                "name"
            ).value = data.name || "";

            localStorage.setItem(
                "name",
                data.name || ""
            );

            localStorage.setItem(
                "username",
                data.username || ""
            );

        } catch (error) {
            console.error(
                "User information error:",
                error
            );

            alert(
                "Your session has expired. Please log in again."
            );

            redirectToLogin();
        }
    }

    function logout() {
        const shouldLogout = confirm(
            "Are you sure you want to log out?"
        );

        if (!shouldLogout) {
            return;
        }

        localStorage.removeItem("token");
        localStorage.removeItem("username");
        localStorage.removeItem("name");
        localStorage.removeItem("currentOrderId");

        window.location.href = "Login.html";
    }

    function validateForm(data) {
        if (
            !data.name ||
            !data.address ||
            !data.city ||
            !data.state ||
            !data.pincode ||
            !data.date ||
            !data.time ||
            !data.mobile ||
            !data.item ||
            !data.language
        ) {
            return "Please fill in all fields.";
        }

        if (!/^\d{6}$/.test(data.pincode)) {
            return "Pincode must contain exactly 6 digits.";
        }

        if (!/^\d{10}$/.test(data.mobile)) {
            return "Mobile number must contain exactly 10 digits.";
        }

        const selectedDate = new Date(
            `${data.date}T00:00:00`
        );

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        if (selectedDate < today) {
            return "Shopping date cannot be in the past.";
        }

        return "";
    }

    document
        .getElementById("shoppingForm")
        .addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const submitButton =
                    document.getElementById(
                        "submitButton"
                    );

                const currentToken =
                    localStorage.getItem("token");

                if (!currentToken) {
                    alert(
                        "Please log in before creating a shopping request."
                    );

                    redirectToLogin();
                    return;
                }

                const formData = {
                    name: document
                        .getElementById("name")
                        .value
                        .trim(),

                    address: document
                        .getElementById("address")
                        .value
                        .trim(),

                    city: document
                        .getElementById("city")
                        .value
                        .trim(),

                    state: document
                        .getElementById("state")
                        .value
                        .trim(),

                    pincode: document
                        .getElementById("pincode")
                        .value
                        .replace(/\D/g, ""),

                    date: document
                        .getElementById(
                            "shopping-date"
                        )
                        .value,

                    time: document
                        .getElementById(
                            "shopping-time"
                        )
                        .value,

                    mobile: document
                        .getElementById("mobile")
                        .value
                        .replace(/\D/g, ""),

                    item: document
                        .getElementById("item")
                        .value
                        .trim(),

                    language: document
                        .getElementById("language")
                        .value
                };

                const validationError =
                    validateForm(formData);

                if (validationError) {
                    showMessage(
                        validationError,
                        "error"
                    );
                    return;
                }

                submitButton.disabled = true;
                submitButton.textContent =
                    "Booking assistant...";

                showMessage("", "error");

                document.getElementById(
                    "assistantResult"
                ).style.display = "none";

                try {
                    const response = await fetch(
                        `${API_BASE_URL}/submit-details`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                Authorization:
                                    `Bearer ${currentToken}`
                            },

                            body: JSON.stringify(
                                formData
                            )
                        }
                    );

                    const data =
                        await response.json();

                    if (
                        response.status === 401 ||
                        response.status === 403
                    ) {
                        alert(
                            "Your session has expired. Please log in again."
                        );

                        redirectToLogin();
                        return;
                    }

                    if (!response.ok) {
                        showMessage(
                            data.message ||
                            "Unable to create the shopping request.",
                            "error"
                        );
                        return;
                    }

                    localStorage.setItem(
                        "currentOrderId",
                        data.orderId
                    );

                    document.getElementById(
                        "resultOrderId"
                    ).textContent =
                        data.orderId || "Not available";

                    document.getElementById(
                        "resultAssistantName"
                    ).textContent =
                        data.assistantName ||
                        "Not available";

                    document.getElementById(
                        "resultAssistantPhone"
                    ).textContent =
                        data.assistantPhone ||
                        "Not available";

                    const whatsappLink =
                        document.getElementById(
                            "whatsappLink"
                        );

                    whatsappLink.href =
                        data.whatsappLink || "#";

                    document.getElementById(
                        "assistantResult"
                    ).style.display = "block";

                    showMessage(
                        data.message ||
                        "Assistant assigned successfully.",
                        "success"
                    );

                    document.getElementById(
                        "assistantResult"
                    ).scrollIntoView({
                        behavior: "smooth"
                    });

                } catch (error) {
                    console.error(
                        "Shopping request error:",
                        error
                    );

                    showMessage(
                        "Unable to connect to the server. Please try again.",
                        "error"
                    );

                } finally {
                    submitButton.disabled = false;
                    submitButton.textContent =
                        "Book Assistant";
                }
            }
        );

    function cancelForm() {
        const shouldClear = confirm(
            "Clear all entered shopping details?"
        );

        if (!shouldClear) {
            return;
        }

        const savedName =
            document.getElementById("name").value;

        document
            .getElementById("shoppingForm")
            .reset();

        document.getElementById("name").value =
            savedName;

        document.getElementById(
            "assistantResult"
        ).style.display = "none";

        showMessage("", "error");

        setMinimumShoppingDate();
    }

    function setMinimumShoppingDate() {
        const today =
            new Date()
                .toISOString()
                .split("T")[0];

        const dateInput =
            document.getElementById(
                "shopping-date"
            );

        dateInput.min = today;
    }

    setMinimumShoppingDate();
    fetchUserInfo();
</script>

</body>
</html>
