<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payment | Hakuna Express</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #a0d2eb;
            color: #263238;
            min-height: 100vh;
        }

        header {
            background-color: #5c6bc0;
            color: white;
            padding: 15px 20px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.18);
        }

        .header-container {
            max-width: 1000px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
        }

        .back-button {
            background-color: white;
            color: #3949ab;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 18px 40px;
        }

        .card {
            background-color: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.14);
        }

        h1 {
            text-align: center;
            color: #3949ab;
            margin-bottom: 22px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            font-size: 17px;
        }

        .bill-section {
            display: none;
        }

        .bill-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .bill-row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: bold;
            color: #455a64;
        }

        .value {
            text-align: right;
            word-break: break-word;
        }

        .total-row {
            margin-top: 12px;
            background-color: #e8eaf6;
            padding: 16px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #283593;
        }

        .status-box {
            margin-top: 18px;
            padding: 14px;
            border-radius: 7px;
            font-weight: bold;
        }

        .status-generated,
        .status-payment_pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-paid {
            background-color: #d1ecf1;
            color: #0c5460;
        }

        .status-admin_verified {
            background-color: #d8f3dc;
            color: #1b5e20;
        }

        .status-payment_failed,
        .status-admin_rejected {
            background-color: #ffebee;
            color: #b71c1c;
        }

        .pay-button {
            width: 100%;
            margin-top: 20px;
            border: none;
            border-radius: 7px;
            padding: 13px 20px;
            font-size: 17px;
            font-weight: bold;
            color: white;
            background-color: #3949ab;
            cursor: pointer;
        }

        .pay-button:hover {
            background-color: #303f9f;
        }

        .pay-button:disabled {
            background-color: #9fa8da;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        .message.success {
            display: block;
            background-color: #d8f3dc;
            color: #1b5e20;
        }

        .message.error {
            display: block;
            background-color: #ffebee;
            color: #b71c1c;
        }

        .message.info {
            display: block;
            background-color: #e3f2fd;
            color: #0d47a1;
        }

        @media (max-width: 650px) {
            .header-container {
                flex-direction: column;
                align-items: flex-start;
            }

            .bill-row {
                flex-direction: column;
                gap: 5px;
            }

            .value {
                text-align: left;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-container">
            <div class="brand">
                Hakuna Express Payment
            </div>

            <a
                href="user-dashboard.html"
                class="back-button"
            >
                Back to Dashboard
            </a>
        </div>
    </header>

    <main>
        <div class="card">
            <h1>Pay Your Order Bill</h1>

            <div
                id="loadingText"
                class="loading"
            >
                Loading bill details...
            </div>

            <div
                id="billSection"
                class="bill-section"
            >
                <div class="bill-row">
                    <span class="label">
                        Order ID
                    </span>

                    <span
                        class="value"
                        id="orderIdText"
                    ></span>
                </div>

                <div class="bill-row">
                    <span class="label">
                        Items
                    </span>

                    <span
                        class="value"
                        id="itemsText"
                    ></span>
                </div>

                <div class="bill-row">
                    <span class="label">
                        Assistant
                    </span>

                    <span
                        class="value"
                        id="assistantText"
                    ></span>
                </div>

                <div class="bill-row">
                    <span class="label">
                        Item Amount
                    </span>

                    <span
                        class="value"
                        id="itemAmountText"
                    ></span>
                </div>

                <div class="bill-row">
                    <span class="label">
                        Delivery Charge
                    </span>

                    <span
                        class="value"
                        id="deliveryChargeText"
                    ></span>
                </div>

                <div class="bill-row">
                    <span class="label">
                        Tax
                    </span>

                    <span
                        class="value"
                        id="taxAmountText"
                    ></span>
                </div>

                <div class="bill-row">
                    <span class="label">
                        Discount
                    </span>

                    <span
                        class="value"
                        id="discountAmountText"
                    ></span>
                </div>

                <div class="bill-row">
                    <span class="label">
                        Description
                    </span>

                    <span
                        class="value"
                        id="descriptionText"
                    ></span>
                </div>

                <div class="bill-row total-row">
                    <span>Total Amount</span>

                    <span id="totalAmountText"></span>
                </div>

                <div
                    id="billStatusBox"
                    class="status-box"
                >
                    Bill Status:
                    <span id="billStatusText"></span>
                </div>

                <button
                    id="payButton"
                    class="pay-button"
                    onclick="payBill()"
                >
                    Pay Now
                </button>
            </div>

            <div
                id="messageBox"
                class="message"
            ></div>
        </div>
    </main>

    <script>
        const API_BASE_URL =
            "https://logistics-dwti.onrender.com";

        const token =
            localStorage.getItem("token");

        const params =
            new URLSearchParams(
                window.location.search
            );

        const orderId =
            params.get("orderId");

        let currentBill = null;

        document.addEventListener(
            "DOMContentLoaded",
            initializePage
        );

        async function initializePage() {
            if (!token) {
                alert("Please log in first.");

                window.location.href =
                    "login.html";

                return;
            }

            if (!orderId) {
                document.getElementById(
                    "loadingText"
                ).textContent =
                    "Order ID is missing.";

                showMessage(
                    "Open this page from your order dashboard.",
                    "error"
                );

                return;
            }

            await loadBill();
        }

        async function loadBill() {
            try {
                const response = await fetch(
                    `${API_BASE_URL}/my-orders/${orderId}/bill`,
                    {
                        headers: {
                            Authorization:
                                `Bearer ${token}`
                        }
                    }
                );

                const data =
                    await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message ||
                        "Unable to load bill."
                    );
                }

                currentBill = data.bill;

                displayBill(currentBill);

                document.getElementById(
                    "loadingText"
                ).style.display = "none";

                document.getElementById(
                    "billSection"
                ).style.display = "block";
            } catch (error) {
                document.getElementById(
                    "loadingText"
                ).textContent =
                    error.message;

                showMessage(
                    error.message,
                    "error"
                );
            }
        }

        function displayBill(bill) {
            const order =
                bill.orderId || {};

            const assistant =
                bill.assistantId || {};

            document.getElementById(
                "orderIdText"
            ).textContent =
                order._id ||
                order.id ||
                orderId;

            document.getElementById(
                "itemsText"
            ).textContent =
                formatItems(order.item);

            document.getElementById(
                "assistantText"
            ).textContent =
                assistant.name
                    ? `${assistant.name} ${
                        assistant.phonenumber ||
                        ""
                    }`
                    : "Assigned assistant";

            document.getElementById(
                "itemAmountText"
            ).textContent =
                formatMoney(
                    bill.itemAmount
                );

            document.getElementById(
                "deliveryChargeText"
            ).textContent =
                formatMoney(
                    bill.deliveryCharge
                );

            document.getElementById(
                "taxAmountText"
            ).textContent =
                formatMoney(
                    bill.taxAmount
                );

            document.getElementById(
                "discountAmountText"
            ).textContent =
                `- ${formatMoney(
                    bill.discountAmount
                )}`;

            document.getElementById(
                "descriptionText"
            ).textContent =
                bill.description ||
                "No description";

            document.getElementById(
                "totalAmountText"
            ).textContent =
                formatMoney(
                    bill.totalAmount
                );

            const status =
                bill.billStatus ||
                "generated";

            document.getElementById(
                "billStatusText"
            ).textContent =
                formatStatus(status);

            const statusBox =
                document.getElementById(
                    "billStatusBox"
                );

            statusBox.className =
                `status-box status-${status}`;

            updatePaymentButton(status);
        }

        function updatePaymentButton(status) {
            const payButton =
                document.getElementById(
                    "payButton"
                );

            if (
                status === "paid" ||
                status ===
                    "admin_verified"
            ) {
                payButton.disabled = true;

                payButton.textContent =
                    status ===
                    "admin_verified"
                        ? "Payment Verified"
                        : "Payment Completed";

                showMessage(
                    "This bill has already been paid.",
                    "success"
                );

                return;
            }

            if (
                status ===
                "admin_rejected"
            ) {
                payButton.disabled = true;

                payButton.textContent =
                    "Contact Administrator";

                showMessage(
                    "The payment was rejected by the administrator.",
                    "error"
                );

                return;
            }

            payButton.disabled = false;

            payButton.textContent =
                `Pay ${formatMoney(
                    currentBill.totalAmount
                )}`;
        }

        async function payBill() {
            const payButton =
                document.getElementById(
                    "payButton"
                );

            payButton.disabled = true;

            payButton.textContent =
                "Starting Payment...";

            try {
                const response = await fetch(
                    `${API_BASE_URL}/my-orders/${orderId}/create-payment`,
                    {
                        method: "POST",
                        headers: {
                            Authorization:
                                `Bearer ${token}`
                        }
                    }
                );

                const data =
                    await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message ||
                        "Unable to start payment."
                    );
                }

                const options = {
                    key: data.keyId,

                    amount: data.amount,

                    currency:
                        data.currency,

                    name:
                        "Hakuna Express",

                    description:
                        "Order Payment",

                    order_id:
                        data.razorpayOrderId,

                    handler:
                        async function (
                            razorpayResponse
                        ) {
                            await verifyPayment(
                                razorpayResponse
                            );
                        },

                    theme: {
                        color: "#5c6bc0"
                    },

                    modal: {
                        ondismiss:
                            function () {
                                payButton.disabled =
                                    false;

                                payButton.textContent =
                                    `Pay ${formatMoney(
                                        currentBill.totalAmount
                                    )}`;
                            }
                    }
                };

                const checkout =
                    new Razorpay(options);

                checkout.on(
                    "payment.failed",
                    function (response) {
                        const message =
                            response.error
                                ?.description ||
                            "Payment failed.";

                        showMessage(
                            message,
                            "error"
                        );

                        payButton.disabled =
                            false;

                        payButton.textContent =
                            `Pay ${formatMoney(
                                currentBill.totalAmount
                            )}`;
                    }
                );

                checkout.open();
            } catch (error) {
                showMessage(
                    error.message,
                    "error"
                );

                payButton.disabled = false;

                payButton.textContent =
                    `Pay ${formatMoney(
                        currentBill.totalAmount
                    )}`;
            }
        }

        async function verifyPayment(
            razorpayResponse
        ) {
            showMessage(
                "Verifying payment...",
                "info"
            );

            try {
                const response = await fetch(
                    `${API_BASE_URL}/payments/verify`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            Authorization:
                                `Bearer ${token}`
                        },

                        body: JSON.stringify({
                            razorpay_order_id:
                                razorpayResponse
                                    .razorpay_order_id,

                            razorpay_payment_id:
                                razorpayResponse
                                    .razorpay_payment_id,

                            razorpay_signature:
                                razorpayResponse
                                    .razorpay_signature
                        })
                    }
                );

                const data =
                    await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message ||
                        "Payment verification failed."
                    );
                }

                showMessage(
                    "Payment completed and verified successfully.",
                    "success"
                );

                setTimeout(
                    () => {
                        window.location.reload();
                    },
                    1200
                );
            } catch (error) {
                showMessage(
                    error.message,
                    "error"
                );
            }
        }

        function formatItems(items) {
            if (Array.isArray(items)) {
                return items.join(", ");
            }

            return items || "-";
        }

        function formatMoney(value) {
            const amount =
                Number(value || 0);

            return amount.toLocaleString(
                "en-IN",
                {
                    style: "currency",
                    currency: "INR",
                    minimumFractionDigits: 2
                }
            );
        }

        function formatStatus(status) {
            return String(status)
                .replaceAll("_", " ")
                .replace(
                    /\b\w/g,
                    (letter) =>
                        letter.toUpperCase()
                );
        }

        function showMessage(
            message,
            type
        ) {
            const box =
                document.getElementById(
                    "messageBox"
                );

            box.textContent = message;

            box.className =
                `message ${type}`;
        }
    </script>
</body>
</html>
