<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Track Your Order | Hakuna Express</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f7fa;
            color: #333;
        }

        header {
            width: 100%;
            padding: 20px;
            color: white;
            background-color: #5c6bc0;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            margin: 0;
        }

        .page-wrapper {
            display: flex;
            justify-content: center;
            padding: 40px 15px;
        }

        .tracking-box {
            width: 100%;
            max-width: 520px;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .tracking-box h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #3f51b5;
        }

        input[type="text"] {
            width: 100%;
            padding: 11px;
            margin-bottom: 15px;
            border: 1px solid #bbb;
            border-radius: 5px;
            outline: none;
            font-size: 15px;
        }

        input[type="text"]:focus {
            border-color: #5c6bc0;
            box-shadow: 0 0 0 2px rgba(92, 107, 192, 0.15);
        }

        .button-row {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 11px 18px;
            color: white;
            background-color: #5c6bc0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            background-color: #3f51b5;
        }

        button:disabled {
            background-color: #9fa8da;
            cursor: not-allowed;
        }

        .logout-btn {
            background-color: #d32f2f;
        }

        .logout-btn:hover {
            background-color: #b71c1c;
        }

        .result {
            display: none;
            margin-top: 22px;
            padding: 18px;
            background-color: #f5f7ff;
            border: 1px solid #c5cae9;
            border-radius: 8px;
            text-align: left;
        }

        .result p {
            margin: 8px 0;
            overflow-wrap: anywhere;
        }

        .message {
            min-height: 20px;
            margin-top: 18px;
            font-size: 14px;
            font-weight: bold;
        }

        .error-message {
            color: #d32f2f;
        }

        .success-message {
            color: #2e7d32;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            color: white;
            background-color: #5c6bc0;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        @media (max-width: 550px) {
            .tracking-box {
                padding: 22px;
            }

            .button-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Track Your Order</h1>
</header>

<main class="page-wrapper">

    <section class="tracking-box">

        <h2>Enter Your Order ID</h2>

        <input
            type="text"
            id="orderIdInput"
            placeholder="Paste your 24-character order ID"
            maxlength="24"
            autocomplete="off"
        >

        <div class="button-row">

            <button
                type="button"
                id="trackButton"
                onclick="trackOrder()"
            >
                Track Order
            </button>

            <button
                type="button"
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

        <p
            id="message"
            class="message"
            aria-live="polite"
        ></p>

        <div
            id="result"
            class="result"
        ></div>

    </section>

</main>

<script>
    const API_BASE_URL =
        "https://logistics-dwti.onrender.com";

    function showMessage(message, type = "") {
        const messageElement =
            document.getElementById("message");

        messageElement.textContent = message;

        if (type === "error") {
            messageElement.className =
                "message error-message";
        } else if (type === "success") {
            messageElement.className =
                "message success-message";
        } else {
            messageElement.className =
                "message";
        }
    }

    function formatStatus(status) {
        if (!status) {
            return "Not available";
        }

        return status
            .replaceAll("_", " ")
            .replace(
                /\b\w/g,
                function (letter) {
                    return letter.toUpperCase();
                }
            );
    }

    function formatDate(dateValue) {
        if (!dateValue) {
            return "Not available";
        }

        const date = new Date(dateValue);

        if (Number.isNaN(date.getTime())) {
            return "Not available";
        }

        return date.toLocaleString();
    }

    async function trackOrder() {
        const orderId = document
            .getElementById("orderIdInput")
            .value
            .trim();

        const resultDiv =
            document.getElementById("result");

        const trackButton =
            document.getElementById("trackButton");

        const token =
            localStorage.getItem("token");

        resultDiv.style.display = "none";
        resultDiv.innerHTML = "";
        showMessage("");

        if (!orderId) {
            showMessage(
                "Please enter an order ID.",
                "error"
            );
            return;
        }

        if (!/^[a-fA-F0-9]{24}$/.test(orderId)) {
            showMessage(
                "Order ID must contain exactly 24 hexadecimal characters.",
                "error"
            );
            return;
        }

        if (!token) {
            showMessage(
                "You are not logged in. Please log in first.",
                "error"
            );

            setTimeout(function () {
                window.location.href = "login.html";
            }, 1200);

            return;
        }

        trackButton.disabled = true;
        trackButton.textContent = "Tracking...";

        try {
            const response = await fetch(
                `${API_BASE_URL}/track-order/${orderId}`,
                {
                    method: "GET",

                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

            let data = {};

            try {
                data = await response.json();
            } catch (error) {
                console.error(
                    "Invalid server response:",
                    error
                );
            }

            console.log(
                "Track order response:",
                data
            );

            if (
                response.status === 401 ||
                response.status === 403
            ) {
                showMessage(
                    "Your session has expired. Please log in again.",
                    "error"
                );

                localStorage.removeItem("token");

                setTimeout(function () {
                    window.location.href =
                        "login.html";
                }, 1200);

                return;
            }

            if (!response.ok) {
                showMessage(
                    data.message ||
                    "Order not found.",
                    "error"
                );
                return;
            }

            /*
             * Supports response forms such as:
             *
             * { status, updatedAt }
             *
             * or
             *
             * { order: { currentStatus, updatedAt } }
             */

            const order =
                data.order || data;

            const status =
                order.currentStatus ||
                order.status ||
                data.currentStatus ||
                data.status;

            const updatedAt =
                order.updatedAt ||
                data.updatedAt ||
                order.createdAt ||
                data.createdAt;

            resultDiv.innerHTML = `
                <p>
                    <strong>Order ID:</strong>
                    ${order.id || order._id || orderId}
                </p>

                <p>
                    <strong>Status:</strong>
                    <span class="status-badge">
                        ${formatStatus(status)}
                    </span>
                </p>

                <p>
                    <strong>Last Updated:</strong>
                    ${formatDate(updatedAt)}
                </p>

                ${
                    order.item
                        ? `
                            <p>
                                <strong>Items:</strong>
                                ${order.item}
                            </p>
                        `
                        : ""
                }

                ${
                    order.assistantName
                        ? `
                            <p>
                                <strong>Assistant:</strong>
                                ${order.assistantName}
                            </p>
                        `
                        : ""
                }
            `;

            resultDiv.style.display = "block";

            showMessage(
                "Order details loaded successfully.",
                "success"
            );

        } catch (error) {
            console.error(
                "Track order error:",
                error
            );

            showMessage(
                "Unable to connect to the server. Please try again.",
                "error"
            );

        } finally {
            trackButton.disabled = false;
            trackButton.textContent =
                "Track Order";
        }
    }

    function logout() {
        const shouldLogout = confirm(
            "Are you sure you want to log out?"
        );

        if (!shouldLogout) {
            return;
        }

        localStorage.removeItem("token");
        localStorage.removeItem("username");
        localStorage.removeItem("name");
        localStorage.removeItem("currentOrderId");

        window.location.href =
            "login.html";
    }

    function loadSavedOrderId() {
        const savedOrderId =
            localStorage.getItem(
                "currentOrderId"
            );

        if (!savedOrderId) {
            return;
        }

        document.getElementById(
            "orderIdInput"
        ).value = savedOrderId;
    }

    document
        .getElementById("orderIdInput")
        .addEventListener(
            "keydown",
            function (event) {
                if (event.key === "Enter") {
                    trackOrder();
                }
            }
        );

    loadSavedOrderId();
</script>

</body>
</html>
