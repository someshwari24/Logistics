<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        User Dashboard | Hakuna Express
    </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #eef5fb;
            color: #263238;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #3949ab;
            color: white;
            padding: 14px 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
        }

        .header-container {
            max-width: 1300px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .welcome-text {
            font-size: 14px;
        }

        button,
        .button-link {
            border: none;
            border-radius: 7px;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s;
        }

        button:hover,
        .button-link:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        .logout-button {
            background: #e53935;
            color: white;
        }

        main {
            max-width: 1300px;
            margin: 28px auto;
            padding: 0 18px 50px;
        }

        .hero {
            background: linear-gradient(
                135deg,
                #3949ab,
                #7986cb
            );
            color: white;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 22px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        }

        .hero h1 {
            margin-bottom: 8px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1.15fr;
            gap: 22px;
            align-items: start;
        }

        .card {
            background: white;
            border-radius: 13px;
            padding: 22px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.11);
        }

        .card h2 {
            color: #3949ab;
            margin-bottom: 18px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #37474f;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #b0bec5;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #3949ab;
            box-shadow: 0 0 0 2px rgba(57, 73, 171, 0.12);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .primary-button {
            background: #3949ab;
            color: white;
        }

        .secondary-button {
            background: #546e7a;
            color: white;
        }

        .success-button {
            background: #16803c;
            color: white;
        }

        .warning-button {
            background: #ef6c00;
            color: white;
        }

        .danger-button {
            background: #c62828;
            color: white;
        }

        .disabled-button {
            background: #78909c;
            color: white;
            cursor: not-allowed;
            opacity: 0.8;
        }

        .assistant-search-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .assistant-search-row .form-group {
            flex: 1;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 7px;
            font-weight: bold;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .orders-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .order-card {
            border: 1px solid #d9e2ec;
            border-radius: 11px;
            padding: 17px;
            background: #fbfdff;
        }

        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 13px;
        }

        .order-id {
            color: #3949ab;
            font-size: 16px;
            word-break: break-all;
        }

        .order-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 16px;
            margin-bottom: 14px;
        }

        .detail-item {
            font-size: 14px;
            line-height: 1.45;
        }

        .detail-item strong {
            color: #37474f;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: capitalize;
        }

        .status-request-created,
        .status-assistant-assigned,
        .status-packed,
        .status-shipped,
        .status-in-transit,
        .status-out-for-delivery {
            background: #e8eaf6;
            color: #283593;
        }

        .status-delivered {
            background: #dcfce7;
            color: #166534;
        }

        .status-cancelled,
        .status-returned {
            background: #fee2e2;
            color: #991b1b;
        }

        .payment-paid {
            background: #dcfce7;
            color: #166534;
        }

        .payment-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .payment-unpaid {
            background: #fee2e2;
            color: #991b1b;
        }

        .payment-not-generated {
            background: #eceff1;
            color: #455a64;
        }

        .payment-rejected,
        .payment-failed {
            background: #fee2e2;
            color: #991b1b;
        }

        .order-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 35px 15px;
            color: #607d8b;
            border: 1px dashed #b0bec5;
            border-radius: 9px;
        }

        .loading {
            text-align: center;
            padding: 25px;
            color: #546e7a;
        }

        .small-note {
            margin-top: 6px;
            font-size: 12px;
            color: #607d8b;
        }

        @media (max-width: 1000px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 700px) {
            .header-container,
            .orders-header,
            .order-card-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
                justify-content: space-between;
            }

            .form-grid,
            .order-details {
                grid-template-columns: 1fr;
            }

            .assistant-search-row {
                flex-direction: column;
                align-items: stretch;
            }

            .order-actions {
                flex-direction: column;
            }

            .order-actions button,
            .order-actions .button-link {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-container">
        <div class="brand">
            Hakuna Express
        </div>

        <div class="header-actions">
            <span
                id="headerWelcome"
                class="welcome-text"
            >
                Welcome
            </span>

            <button
                class="logout-button"
                onclick="logout()"
            >
                Logout
            </button>
        </div>
    </div>
</header>

<main>

    <section class="hero">
        <h1 id="welcomeHeading">
            Welcome to your dashboard
        </h1>

        <p>
            Place shopping requests, select an assistant,
            track orders and pay generated bills.
        </p>
    </section>

    <div id="messageBox" class="message"></div>

    <div class="layout">

        <!-- PLACE ORDER SECTION -->
        <section class="card">

            <h2>Place Shopping Request</h2>

            <form id="orderForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="customerName">
                            Customer Name
                        </label>

                        <input
                            id="customerName"
                            type="text"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="mobile">
                            Mobile Number
                        </label>

                        <input
                            id="mobile"
                            type="tel"
                            minlength="10"
                            maxlength="15"
                            pattern="[0-9]{10,15}"
                            required
                        >
                    </div>

                    <div class="form-group full-width">
                        <label for="item">
                            Shopping Items
                        </label>

                        <textarea
                            id="item"
                            placeholder="Example: Rice, vegetables, milk"
                            required
                        ></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label for="address">
                            Delivery Address
                        </label>

                        <textarea
                            id="address"
                            placeholder="Enter complete address"
                            required
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="city">
                            City
                        </label>

                        <input
                            id="city"
                            type="text"
                            placeholder="Hyderabad"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="state">
                            State
                        </label>

                        <input
                            id="state"
                            type="text"
                            placeholder="Telangana"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="pincode">
                            PIN Code
                        </label>

                        <input
                            id="pincode"
                            type="text"
                            minlength="4"
                            maxlength="10"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="language">
                            Preferred Language
                        </label>

                        <select id="language" required>
                            <option value="">
                                Select language
                            </option>

                            <option value="English">
                                English
                            </option>

                            <option value="Hindi">
                                Hindi
                            </option>

                            <option value="Telugu">
                                Telugu
                            </option>

                            <option value="Tamil">
                                Tamil
                            </option>

                            <option value="Kannada">
                                Kannada
                            </option>

                            <option value="Malayalam">
                                Malayalam
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="shoppingDate">
                            Shopping Date
                        </label>

                        <input
                            id="shoppingDate"
                            type="date"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="shoppingTime">
                            Shopping Time
                        </label>

                        <input
                            id="shoppingTime"
                            type="time"
                            required
                        >
                    </div>

                    <div class="form-group full-width">

                        <label for="assistantId">
                            Available Assistant
                        </label>

                        <div class="assistant-search-row">

                            <div class="form-group">
                                <select
                                    id="assistantId"
                                    required
                                >
                                    <option value="">
                                        Enter city and state, then search
                                    </option>
                                </select>

                                <p class="small-note">
                                    Assistants are searched automatically
                                    using the entered city and state.
                                </p>
                            </div>

                            <button
                                type="button"
                                class="secondary-button"
                                onclick="loadAssistants()"
                            >
                                Search Assistants
                            </button>

                        </div>
                    </div>

                </div>

                <button
                    id="submitOrderButton"
                    type="submit"
                    class="primary-button"
                >
                    Place Order
                </button>

            </form>

        </section>

        <!-- ORDERS SECTION -->
        <section class="card">

            <div class="orders-header">
                <h2>My Orders</h2>

                <button
                    type="button"
                    class="secondary-button"
                    onclick="loadOrders()"
                >
                    Refresh
                </button>
            </div>

            <div
                id="ordersContainer"
                class="orders-container"
            >
                <div class="loading">
                    Loading orders...
                </div>
            </div>

        </section>

    </div>

</main>

<script>
    const API_BASE_URL =
        "https://logistics-dwti.onrender.com";

    const token =
        localStorage.getItem("token");

    let currentUser = null;

    document.addEventListener(
        "DOMContentLoaded",
        initializeDashboard
    );

    document
        .getElementById("orderForm")
        .addEventListener(
            "submit",
            submitOrder
        );

    document
        .getElementById("city")
        .addEventListener(
            "change",
            resetAndLoadAssistants
        );

    document
        .getElementById("state")
        .addEventListener(
            "change",
            resetAndLoadAssistants
        );

    document
        .getElementById("city")
        .addEventListener(
            "blur",
            loadAssistants
        );

    document
        .getElementById("state")
        .addEventListener(
            "blur",
            loadAssistants
        );

    async function initializeDashboard() {
        if (!token) {
            alert("Please log in first.");

            location.href =
                "login.html";

            return;
        }

        setMinimumDate();

        await loadCurrentUser();

        await loadOrders();
    }

    function setMinimumDate() {
        const today =
            new Date();

        const year =
            today.getFullYear();

        const month =
            String(
                today.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                today.getDate()
            ).padStart(2, "0");

        document
            .getElementById("shoppingDate")
            .min =
                `${year}-${month}-${day}`;
    }

    async function loadCurrentUser() {
        try {
            const response = await fetch(
                `${API_BASE_URL}/me`,
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

            const data =
                await response.json();

            if (
                response.status === 401 ||
                response.status === 403
            ) {
                logout();
                return;
            }

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    "Unable to load user details."
                );
            }

            currentUser =
                data.user;

            document
                .getElementById(
                    "customerName"
                )
                .value =
                    currentUser.name || "";

            document
                .getElementById(
                    "headerWelcome"
                )
                .textContent =
                    `Welcome, ${
                        currentUser.name ||
                        "Customer"
                    }`;

            document
                .getElementById(
                    "welcomeHeading"
                )
                .textContent =
                    `Welcome, ${
                        currentUser.name ||
                        "Customer"
                    }`;

        } catch (error) {
            showMessage(
                error.message,
                "error"
            );
        }
    }

    function resetAndLoadAssistants() {
        const assistantSelect =
            document.getElementById(
                "assistantId"
            );

        assistantSelect.innerHTML = `
            <option value="">
                Loading assistants...
            </option>
        `;

        loadAssistants();
    }

    async function loadAssistants() {
        const city =
            document
                .getElementById("city")
                .value
                .trim();

        const state =
            document
                .getElementById("state")
                .value
                .trim();

        const assistantSelect =
            document.getElementById(
                "assistantId"
            );

        if (!city || !state) {
            assistantSelect.innerHTML = `
                <option value="">
                    Enter city and state first
                </option>
            `;

            return;
        }

        assistantSelect.innerHTML = `
            <option value="">
                Searching assistants...
            </option>
        `;

        try {
            const url =
                `${API_BASE_URL}/assistants` +
                `?city=${encodeURIComponent(city)}` +
                `&state=${encodeURIComponent(state)}`;

            const response =
                await fetch(url);

            const data =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    "Unable to search assistants."
                );
            }

            const assistants =
                data.assistants || [];

            if (
                !Array.isArray(assistants) ||
                assistants.length === 0
            ) {
                assistantSelect.innerHTML = `
                    <option value="">
                        No assistant available in this city and state
                    </option>
                `;

                showMessage(
                    "No available assistant was found for the entered city and state.",
                    "error"
                );

                return;
            }

            assistantSelect.innerHTML = `
                <option value="">
                    Select an assistant
                </option>
            `;

            assistants.forEach(
                (assistant) => {
                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        assistant._id ||
                        assistant.id;

                    option.textContent =
                        `${assistant.name} - ` +
                        `${assistant.phonenumber}`;

                    assistantSelect.appendChild(
                        option
                    );
                }
            );

            showMessage(
                `${assistants.length} assistant(s) found.`,
                "success"
            );

        } catch (error) {
            assistantSelect.innerHTML = `
                <option value="">
                    Unable to load assistants
                </option>
            `;

            showMessage(
                error.message,
                "error"
            );
        }
    }

    async function submitOrder(event) {
        event.preventDefault();

        const submitButton =
            document.getElementById(
                "submitOrderButton"
            );

        const orderData = {
            name:
                document
                    .getElementById(
                        "customerName"
                    )
                    .value
                    .trim(),

            address:
                document
                    .getElementById(
                        "address"
                    )
                    .value
                    .trim(),

            city:
                document
                    .getElementById(
                        "city"
                    )
                    .value
                    .trim(),

            state:
                document
                    .getElementById(
                        "state"
                    )
                    .value
                    .trim(),

            assistantId:
                document
                    .getElementById(
                        "assistantId"
                    )
                    .value,

            pincode:
                document
                    .getElementById(
                        "pincode"
                    )
                    .value
                    .trim(),

            mobile:
                document
                    .getElementById(
                        "mobile"
                    )
                    .value
                    .trim(),

            item:
                document
                    .getElementById(
                        "item"
                    )
                    .value
                    .trim(),

            language:
                document
                    .getElementById(
                        "language"
                    )
                    .value,

            date:
                document
                    .getElementById(
                        "shoppingDate"
                    )
                    .value,

            time:
                document
                    .getElementById(
                        "shoppingTime"
                    )
                    .value
        };

        if (!orderData.assistantId) {
            showMessage(
                "Please search and select an available assistant.",
                "error"
            );

            return;
        }

        submitButton.disabled = true;
        submitButton.textContent =
            "Placing Order...";

        try {
            const response = await fetch(
                `${API_BASE_URL}/submit-details`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        Authorization:
                            `Bearer ${token}`
                    },

                    body:
                        JSON.stringify(
                            orderData
                        )
                }
            );

            const data =
                await response.json();

            if (
                response.status === 401 ||
                response.status === 403
            ) {
                logout();
                return;
            }

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    "Unable to place order."
                );
            }

            showMessage(
                "Shopping request submitted successfully.",
                "success"
            );

            if (
                data.whatsappUrl &&
                data.assistant
            ) {
                const openWhatsApp =
                    confirm(
                        "Order created successfully. Open WhatsApp to notify the assistant?"
                    );

                if (openWhatsApp) {
                    window.open(
                        data.whatsappUrl,
                        "_blank"
                    );
                }
            }

            resetOrderForm();

            await loadOrders();

        } catch (error) {
            showMessage(
                error.message,
                "error"
            );

        } finally {
            submitButton.disabled = false;

            submitButton.textContent =
                "Place Order";
        }
    }

    function resetOrderForm() {
        document
            .getElementById("orderForm")
            .reset();

        if (currentUser) {
            document
                .getElementById(
                    "customerName"
                )
                .value =
                    currentUser.name || "";
        }

        document
            .getElementById(
                "assistantId"
            )
            .innerHTML = `
                <option value="">
                    Enter city and state, then search
                </option>
            `;

        setMinimumDate();
    }

    async function loadOrders() {
        const ordersContainer =
            document.getElementById(
                "ordersContainer"
            );

        ordersContainer.innerHTML = `
            <div class="loading">
                Loading orders and payment status...
            </div>
        `;

        try {
            const response = await fetch(
                `${API_BASE_URL}/my-orders`,
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

            const data =
                await response.json();

            if (
                response.status === 401 ||
                response.status === 403
            ) {
                logout();
                return;
            }

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    "Unable to load orders."
                );
            }

            const orders =
                data.orders || [];

            if (!orders.length) {
                ordersContainer.innerHTML = `
                    <div class="empty-state">
                        You have not placed any orders yet.
                    </div>
                `;

                return;
            }

            const ordersWithBills =
                await Promise.all(
                    orders.map(
                        async (order) => {
                            const bill =
                                await getBillDetails(
                                    order.id
                                );

                            return {
                                ...order,
                                bill
                            };
                        }
                    )
                );

            ordersContainer.innerHTML =
                ordersWithBills
                    .map(renderOrderCard)
                    .join("");

        } catch (error) {
            ordersContainer.innerHTML = `
                <div class="empty-state">
                    ${escapeHtml(
                        error.message
                    )}
                </div>
            `;
        }
    }

    async function getBillDetails(
        orderId
    ) {
        try {
            const response = await fetch(
                `${API_BASE_URL}/my-orders/${orderId}/bill`,
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

            if (response.status === 404) {
                return {
                    exists: false,
                    billStatus:
                        "not_generated",
                    totalAmount: 0
                };
            }

            const data =
                await response.json();

            if (!response.ok) {
                return {
                    exists: false,
                    billStatus:
                        "not_generated",
                    totalAmount: 0
                };
            }

            return {
                exists: true,

                billStatus:
                    data.bill?.billStatus ||
                    "generated",

                totalAmount:
                    data.bill?.totalAmount ||
                    0,

                paymentGatewayStatus:
                    data.bill
                        ?.paymentGatewayStatus ||
                    "",

                razorpayPaymentId:
                    data.bill
                        ?.razorpayPaymentId ||
                    ""
            };

        } catch (error) {
            console.error(
                "Bill loading error:",
                error
            );

            return {
                exists: false,
                billStatus:
                    "not_generated",
                totalAmount: 0
            };
        }
    }

    function renderOrderCard(order) {
        const orderStatus =
            order.currentStatus ||
            "assistant_assigned";

        const billStatus =
            order.bill?.billStatus ||
            "not_generated";

        const isPaid =
            billStatus === "paid" ||
            billStatus ===
                "admin_verified";

        const assistantName =
            order.assistant?.name ||
            "Not available";

        const assistantPhone =
            order.assistant
                ?.phonenumber ||
            "-";

        const formattedDate =
            formatDate(
                order.shoppingDate
            );

        const paymentSection =
            getPaymentSection(
                order
            );

        const paymentButton =
            getPaymentButton(
                order.id,
                order.bill
            );

        const cancelButton =
            getCancelButton(
                order
            );

        return `
            <article class="order-card">

                <div class="order-card-header">

                    <div>
                        <h3 class="order-id">
                            Order ID:
                            ${escapeHtml(order.id)}
                        </h3>

                        <p class="small-note">
                            Created:
                            ${formatDateTime(
                                order.createdAt
                            )}
                        </p>
                    </div>

                    <span
                        class="badge
                        status-${normalizeClassName(
                            orderStatus
                        )}"
                    >
                        ${formatStatus(
                            orderStatus
                        )}
                    </span>

                </div>

                <div class="order-details">

                    <div class="detail-item">
                        <strong>Items:</strong>
                        ${escapeHtml(
                            order.item
                        )}
                    </div>

                    <div class="detail-item">
                        <strong>Customer:</strong>
                        ${escapeHtml(
                            order.name
                        )}
                    </div>

                    <div class="detail-item">
                        <strong>Address:</strong>
                        ${escapeHtml(
                            order.address
                        )}
                    </div>

                    <div class="detail-item">
                        <strong>Location:</strong>
                        ${escapeHtml(
                            order.city
                        )},
                        ${escapeHtml(
                            order.state
                        )}
                        -
                        ${escapeHtml(
                            order.pincode
                        )}
                    </div>

                    <div class="detail-item">
                        <strong>Shopping Date:</strong>
                        ${formattedDate}
                    </div>

                    <div class="detail-item">
                        <strong>Shopping Time:</strong>
                        ${escapeHtml(
                            order.shoppingTime
                        )}
                    </div>

                    <div class="detail-item">
                        <strong>Assistant:</strong>
                        ${escapeHtml(
                            assistantName
                        )}
                    </div>

                    <div class="detail-item">
                        <strong>Assistant Phone:</strong>
                        ${escapeHtml(
                            assistantPhone
                        )}
                    </div>

                    <div class="detail-item">
                        <strong>Language:</strong>
                        ${escapeHtml(
                            order.language
                        )}
                    </div>

                    <div class="detail-item">
                        <strong>Mobile:</strong>
                        ${escapeHtml(
                            order.mobile
                        )}
                    </div>

                </div>

                ${paymentSection}

                <div class="order-actions">

                    <button
                        class="secondary-button"
                        onclick="openTracking(
                            '${order.id}'
                        )"
                    >
                        Track Order
                    </button>

                    ${paymentButton}

                    <button
                        class="warning-button"
                        onclick="openConfirmation(
                            '${order.id}'
                        )"
                    >
                        Delivery Confirmation
                    </button>

                    <button
                        class="danger-button"
                        onclick="openComplaint(
                            '${order.id}'
                        )"
                    >
                        Raise Complaint
                    </button>

                    ${cancelButton}

                </div>

            </article>
        `;
    }

    function getPaymentSection(order) {
        const bill =
            order.bill || {};

        const billStatus =
            bill.billStatus ||
            "not_generated";

        const amount =
            formatCurrency(
                bill.totalAmount
            );

        if (
            billStatus === "paid" ||
            billStatus ===
                "admin_verified"
        ) {
            return `
                <div class="detail-item">
                    <strong>Payment:</strong>

                    <span
                        class="badge payment-paid"
                    >
                        Paid
                    </span>

                    <strong>
                        ${amount}
                    </strong>
                </div>
            `;
        }

        if (
            billStatus ===
            "payment_pending"
        ) {
            return `
                <div class="detail-item">
                    <strong>Payment:</strong>

                    <span
                        class="badge payment-pending"
                    >
                        Payment Pending
                    </span>

                    <strong>
                        ${amount}
                    </strong>
                </div>
            `;
        }

        if (
            billStatus ===
            "payment_failed"
        ) {
            return `
                <div class="detail-item">
                    <strong>Payment:</strong>

                    <span
                        class="badge payment-failed"
                    >
                        Payment Failed
                    </span>

                    <strong>
                        ${amount}
                    </strong>
                </div>
            `;
        }

        if (
            billStatus ===
            "admin_rejected"
        ) {
            return `
                <div class="detail-item">
                    <strong>Payment:</strong>

                    <span
                        class="badge payment-rejected"
                    >
                        Rejected by Admin
                    </span>

                    <strong>
                        ${amount}
                    </strong>
                </div>
            `;
        }

        if (bill.exists) {
            return `
                <div class="detail-item">
                    <strong>Payment:</strong>

                    <span
                        class="badge payment-unpaid"
                    >
                        Unpaid
                    </span>

                    <strong>
                        ${amount}
                    </strong>
                </div>
            `;
        }

        return `
            <div class="detail-item">
                <strong>Payment:</strong>

                <span
                    class="badge
                    payment-not-generated"
                >
                    Bill Not Generated
                </span>
            </div>
        `;
    }

    function getPaymentButton(
        orderId,
        bill
    ) {
        const billStatus =
            bill?.billStatus ||
            "not_generated";

        if (
            billStatus === "paid" ||
            billStatus ===
                "admin_verified"
        ) {
            return `
                <button
                    class="success-button"
                    disabled
                >
                    ✓ Paid
                </button>
            `;
        }

        if (!bill?.exists) {
            return `
                <button
                    class="disabled-button"
                    disabled
                >
                    Bill Not Generated
                </button>
            `;
        }

        return `
            <button
                class="success-button"
                onclick="openPayment(
                    '${orderId}'
                )"
            >
                View Bill / Pay
            </button>
        `;
    }

    function getCancelButton(order) {
        const blockedStatuses = [
            "shipped",
            "in_transit",
            "out_for_delivery",
            "delivered",
            "returned",
            "cancelled"
        ];

        if (
            blockedStatuses.includes(
                order.currentStatus
            )
        ) {
            return "";
        }

        return `
            <button
                class="danger-button"
                onclick="cancelOrder(
                    '${order.id}'
                )"
            >
                Cancel Order
            </button>
        `;
    }

    async function cancelOrder(
        orderId
    ) {
        const confirmed =
            confirm(
                "Are you sure you want to cancel this order?"
            );

        if (!confirmed) {
            return;
        }

        try {
            const response = await fetch(
                `${API_BASE_URL}/my-orders/${orderId}/cancel`,
                {
                    method: "PATCH",

                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

            const data =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    "Unable to cancel order."
                );
            }

            showMessage(
                "Order cancelled successfully.",
                "success"
            );

            await loadOrders();

        } catch (error) {
            showMessage(
                error.message,
                "error"
            );
        }
    }

    function openTracking(orderId) {
        location.href =
            `orderUpdates.html?orderId=${encodeURIComponent(orderId)}`;
    }

    function openPayment(orderId) {
        location.href =
            `payment.html?orderId=${encodeURIComponent(orderId)}`;
    }

    function openConfirmation(
        orderId
    ) {
        location.href =
            `confirmation.html?orderId=${encodeURIComponent(orderId)}`;
    }

    function openComplaint(orderId) {
        location.href =
            `complaint.html?orderId=${encodeURIComponent(orderId)}`;
    }

    function formatStatus(status) {
        return String(
            status || ""
        )
            .replaceAll("_", " ")
            .replace(/\b\w/g, (letter) =>
                letter.toUpperCase()
            );
    }

    function normalizeClassName(
        value
    ) {
        return String(
            value || ""
        )
            .toLowerCase()
            .trim()
            .replaceAll("_", "-")
            .replaceAll(" ", "-");
    }

    function formatCurrency(value) {
        return Number(
            value || 0
        ).toLocaleString(
            "en-IN",
            {
                style: "currency",
                currency: "INR"
            }
        );
    }

    function formatDate(value) {
        if (!value) {
            return "-";
        }

        const date =
            new Date(value);

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {
            return "-";
        }

        return date.toLocaleDateString(
            "en-IN"
        );
    }

    function formatDateTime(value) {
        if (!value) {
            return "-";
        }

        const date =
            new Date(value);

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {
            return "-";
        }

        return date.toLocaleString(
            "en-IN"
        );
    }

    function escapeHtml(value) {
        return String(
            value ?? ""
        )
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function showMessage(
        message,
        type
    ) {
        const box =
            document.getElementById(
                "messageBox"
            );

        box.textContent =
            message;

        box.className =
            `message ${type}`;

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

        setTimeout(() => {
            box.textContent = "";
            box.className =
                "message";
        }, 5000);
    }

    function logout() {
        localStorage.removeItem(
            "token"
        );

        localStorage.removeItem(
            "user"
        );

        location.href =
            "login.html";
    }
</script>

</body>
</html>
