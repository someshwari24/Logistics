<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>User Dashboard | Hakuna Express</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #a0d2eb;
            color: #263238;
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #5c6bc0;
            color: white;
            padding: 14px 20px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.18);
        }

        .header-container {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            font-size: 25px;
            font-weight: bold;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-button {
            border: none;
            border-radius: 6px;
            padding: 10px 14px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .complaint-button {
            background-color: white;
            color: #3949ab;
        }

        .logout-button {
            background-color: #e53935;
            color: white;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 18px 40px;
        }

        .welcome-card {
            background: linear-gradient(
                135deg,
                #3949ab,
                #7986cb
            );
            color: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .welcome-card h1 {
            margin-bottom: 8px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            align-items: start;
        }

        .card {
            background-color: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.14);
        }

        .card h2 {
            color: #3949ab;
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #37474f;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #b0bec5;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #3949ab;
            box-shadow: 0 0 0 2px rgba(57, 73, 171, 0.12);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .primary-button {
            width: 100%;
            border: none;
            background-color: #3949ab;
            color: white;
            padding: 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .primary-button:hover {
            background-color: #303f9f;
        }

        .primary-button:disabled {
            background-color: #9fa8da;
            cursor: not-allowed;
        }

        .orders-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 18px;
        }

        .refresh-button {
            border: none;
            background-color: #00897b;
            color: white;
            padding: 9px 13px;
            border-radius: 6px;
            cursor: pointer;
        }

        .orders-container {
            display: grid;
            gap: 16px;
        }

        .order-card {
            border: 1px solid #d7dce0;
            border-left: 5px solid #5c6bc0;
            border-radius: 9px;
            padding: 18px;
            background-color: #fafafa;
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 13px;
        }

        .order-id {
            font-weight: bold;
            color: #3949ab;
            word-break: break-word;
        }

        .status-badge {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            text-transform: capitalize;
            white-space: nowrap;
        }

        .status-pending,
        .status-submitted {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-assigned,
        .status-shopping {
            background-color: #e3f2fd;
            color: #0d47a1;
        }

        .status-on-the-way,
        .status-out-for-delivery {
            background-color: #ede7f6;
            color: #4527a0;
        }

        .status-delivered,
        .status-completed {
            background-color: #d8f3dc;
            color: #1b5e20;
        }

        .order-row {
            display: grid;
            grid-template-columns: 135px 1fr;
            gap: 10px;
            padding: 5px 0;
        }

        .order-label {
            font-weight: bold;
            color: #455a64;
        }

        .order-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 15px;
        }

        .action-button {
            border: none;
            border-radius: 6px;
            padding: 9px 13px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .track-button {
            background-color: #00897b;
            color: white;
        }

        .payment-button {
            background-color: #3949ab;
            color: white;
        }

        .complaint-action {
            background-color: #fb8c00;
            color: white;
        }

        .confirmation-button {
            background-color: #7b1fa2;
            color: white;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        .message.success {
            display: block;
            background-color: #d8f3dc;
            color: #1b5e20;
        }

        .message.error {
            display: block;
            background-color: #ffebee;
            color: #b71c1c;
        }

        .message.info {
            display: block;
            background-color: #e3f2fd;
            color: #0d47a1;
        }

        .loading,
        .empty-message {
            text-align: center;
            padding: 30px;
            color: #546e7a;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 650px) {
            .header-container {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
            }

            .header-button {
                flex: 1;
                text-align: center;
            }

            .order-top {
                flex-direction: column;
            }

            .order-row {
                grid-template-columns: 1fr;
                gap: 3px;
            }

            .order-actions {
                flex-direction: column;
            }

            .action-button {
                text-align: center;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-container">
            <div class="brand">
                Hakuna Express
            </div>

            <div class="header-actions">
                <a
                    href="complaints.html"
                    class="header-button complaint-button"
                >
                    My Complaints
                </a>

                <button
                    type="button"
                    class="header-button logout-button"
                    onclick="logout()"
                >
                    Logout
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="welcome-card">
            <h1 id="welcomeText">
                Welcome to Hakuna Express
            </h1>

            <p>
                Place a new order, track delivery progress and pay
                assistant-generated bills securely through Razorpay.
            </p>
        </section>

        <div class="dashboard-grid">

            <!-- Place Order Section -->

            <section class="card">
                <h2>Place New Order</h2>

                <form id="orderForm">

                    <div class="form-group">
                        <label for="item">
                            Shopping Items
                        </label>

                        <textarea
                            id="item"
                            required
                            placeholder="Example: Rice 5 kg, milk, vegetables"
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="address">
                            Delivery Address
                        </label>

                        <textarea
                            id="address"
                            required
                            placeholder="House number, street and area"
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            required
                            placeholder="Enter city"
                        >
                    </div>

                    <div class="form-group">
                        <label for="state">
                            State
                        </label>

                        <input
                            type="text"
                            id="state"
                            required
                            placeholder="Enter state"
                        >
                    </div>

                    <div class="form-group">
                        <label for="pincode">
                            PIN Code
                        </label>

                        <input
                            type="text"
                            id="pincode"
                            required
                            maxlength="6"
                            pattern="[0-9]{6}"
                            placeholder="6-digit PIN code"
                        >
                    </div>

                    <div class="form-group">
                        <label for="mobile">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            id="mobile"
                            required
                            maxlength="10"
                            pattern="[0-9]{10}"
                            placeholder="10-digit mobile number"
                        >
                    </div>

                    <div class="form-group">
                        <label for="shoppingDate">
                            Shopping Date
                        </label>

                        <input
                            type="date"
                            id="shoppingDate"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="shoppingTime">
                            Shopping Time
                        </label>

                        <input
                            type="time"
                            id="shoppingTime"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="primary-button"
                        id="submitOrderButton"
                    >
                        Place Order
                    </button>
                </form>

                <div
                    id="orderMessage"
                    class="message"
                ></div>
            </section>

            <!-- Existing Orders Section -->

            <section class="card">
                <div class="orders-header">
                    <h2>My Orders</h2>

                    <button
                        type="button"
                        class="refresh-button"
                        onclick="loadOrders()"
                    >
                        Refresh
                    </button>
                </div>

                <div id="ordersContainer">
                    <div class="loading">
                        Loading your orders...
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        const API_BASE_URL =
            "https://logistics-dwti.onrender.com";

        const token =
            localStorage.getItem("token");

        const orderForm =
            document.getElementById(
                "orderForm"
            );

        document.addEventListener(
            "DOMContentLoaded",
            initializeDashboard
        );

        orderForm.addEventListener(
            "submit",
            submitOrder
        );

        async function initializeDashboard() {
            if (!token) {
                alert("Please log in first.");

                window.location.href =
                    "login.html";

                return;
            }

            setMinimumDate();

            await loadUserInformation();
            await loadOrders();
        }

        function setMinimumDate() {
            const today =
                new Date()
                    .toISOString()
                    .split("T")[0];

            document.getElementById(
                "shoppingDate"
            ).min = today;
        }

        async function loadUserInformation() {
            try {
                const response = await fetch(
                    `${API_BASE_URL}/me`,
                    {
                        headers: {
                            Authorization:
                                `Bearer ${token}`
                        }
                    }
                );

                const data =
                    await response.json();

                if (!response.ok) {
                    return;
                }

                const user =
                    data.user || data;

                const userName =
                    user.name ||
                    user.username ||
                    "";

                if (userName) {
                    document.getElementById(
                        "welcomeText"
                    ).textContent =
                        `Welcome, ${userName}`;
                }
            } catch (error) {
                console.error(
                    "Unable to load user:",
                    error
                );
            }
        }

        async function submitOrder(event) {
            event.preventDefault();

            const submitButton =
                document.getElementById(
                    "submitOrderButton"
                );

            const orderData = {
                item:
                    document
                        .getElementById("item")
                        .value
                        .trim(),

                address:
                    document
                        .getElementById("address")
                        .value
                        .trim(),

                city:
                    document
                        .getElementById("city")
                        .value
                        .trim(),

                state:
                    document
                        .getElementById("state")
                        .value
                        .trim(),

                pincode:
                    document
                        .getElementById("pincode")
                        .value
                        .trim(),

                mobile:
                    document
                        .getElementById("mobile")
                        .value
                        .trim(),

                shoppingDate:
                    document
                        .getElementById(
                            "shoppingDate"
                        )
                        .value,

                shoppingTime:
                    document
                        .getElementById(
                            "shoppingTime"
                        )
                        .value
            };

            if (
                !/^[0-9]{6}$/.test(
                    orderData.pincode
                )
            ) {
                showOrderMessage(
                    "Enter a valid 6-digit PIN code.",
                    "error"
                );

                return;
            }

            if (
                !/^[0-9]{10}$/.test(
                    orderData.mobile
                )
            ) {
                showOrderMessage(
                    "Enter a valid 10-digit mobile number.",
                    "error"
                );

                return;
            }

            submitButton.disabled = true;

            submitButton.textContent =
                "Placing Order...";

            try {
                const response = await fetch(
                    `${API_BASE_URL}/submit-details`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            Authorization:
                                `Bearer ${token}`
                        },

                        body: JSON.stringify(
                            orderData
                        )
                    }
                );

                const data =
                    await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message ||
                        "Unable to place order."
                    );
                }

                showOrderMessage(
                    data.message ||
                    "Order placed successfully.",
                    "success"
                );

                orderForm.reset();
                setMinimumDate();

                await loadOrders();
            } catch (error) {
                showOrderMessage(
                    error.message,
                    "error"
                );
            } finally {
                submitButton.disabled = false;

                submitButton.textContent =
                    "Place Order";
            }
        }

        async function loadOrders() {
            const container =
                document.getElementById(
                    "ordersContainer"
                );

            container.innerHTML = `
                <div class="loading">
                    Loading your orders...
                </div>
            `;

            try {
                const response = await fetch(
                    `${API_BASE_URL}/my-orders`,
                    {
                        headers: {
                            Authorization:
                                `Bearer ${token}`
                        }
                    }
                );

                const data =
                    await response.json();

                if (
                    response.status === 401 ||
                    response.status === 403
                ) {
                    logout();
                    return;
                }

                if (!response.ok) {
                    throw new Error(
                        data.message ||
                        "Unable to load orders."
                    );
                }

                const orders =
                    Array.isArray(data)
                        ? data
                        : data.orders || [];

                displayOrders(orders);
            } catch (error) {
                container.innerHTML = `
                    <div class="empty-message">
                        ${escapeHtml(
                            error.message
                        )}
                    </div>
                `;
            }
        }

        function displayOrders(orders) {
            const container =
                document.getElementById(
                    "ordersContainer"
                );

            if (!orders.length) {
                container.innerHTML = `
                    <div class="empty-message">
                        You have not placed any orders yet.
                    </div>
                `;

                return;
            }

            container.innerHTML = `
                <div class="orders-container">
                    ${orders
                        .map(createOrderCard)
                        .join("")}
                </div>
            `;
        }

        function createOrderCard(order) {
            const id =
                order.id ||
                order._id ||
                "";

            const status =
                order.currentStatus ||
                order.status ||
                "Pending";

            const statusClass =
                normalizeStatus(status);

            const assistant =
                order.assistantName ||
                order.assistantId?.name ||
                order.assistant?.name ||
                "Not assigned yet";

            const items =
                formatItems(order.item);

            const address =
                [
                    order.address,
                    order.city,
                    order.state,
                    order.pincode
                ]
                    .filter(Boolean)
                    .join(", ");

            return `
                <article class="order-card">

                    <div class="order-top">
                        <div class="order-id">
                            Order ID: ${escapeHtml(id)}
                        </div>

                        <div
                            class="status-badge status-${statusClass}"
                        >
                            ${escapeHtml(status)}
                        </div>
                    </div>

                    <div class="order-row">
                        <span class="order-label">
                            Items
                        </span>

                        <span>
                            ${escapeHtml(items)}
                        </span>
                    </div>

                    <div class="order-row">
                        <span class="order-label">
                            Delivery Address
                        </span>

                        <span>
                            ${escapeHtml(
                                address || "-"
                            )}
                        </span>
                    </div>

                    <div class="order-row">
                        <span class="order-label">
                            Mobile
                        </span>

                        <span>
                            ${escapeHtml(
                                order.mobile || "-"
                            )}
                        </span>
                    </div>

                    <div class="order-row">
                        <span class="order-label">
                            Shopping Date
                        </span>

                        <span>
                            ${escapeHtml(
                                formatDate(
                                    order.shoppingDate
                                )
                            )}
                        </span>
                    </div>

                    <div class="order-row">
                        <span class="order-label">
                            Shopping Time
                        </span>

                        <span>
                            ${escapeHtml(
                                order.shoppingTime ||
                                "-"
                            )}
                        </span>
                    </div>

                    <div class="order-row">
                        <span class="order-label">
                            Assistant
                        </span>

                        <span>
                            ${escapeHtml(assistant)}
                        </span>
                    </div>

                    <div class="order-actions">

                        <button
                            type="button"
                            class="action-button track-button"
                            onclick="trackOrder('${id}')"
                        >
                            Track Order
                        </button>

                        <button
                            type="button"
                            class="action-button payment-button"
                            onclick="viewBill('${id}')"
                        >
                            View Bill / Pay
                        </button>

                        <button
                            type="button"
                            class="action-button confirmation-button"
                            onclick="openConfirmation('${id}')"
                        >
                            Delivery Confirmation
                        </button>

                        <button
                            type="button"
                            class="action-button complaint-action"
                            onclick="raiseComplaint('${id}')"
                        >
                            Raise Complaint
                        </button>
                    </div>
                </article>
            `;
        }

        function trackOrder(orderId) {
            window.location.href =
                `tracking.html?orderId=${encodeURIComponent(
                    orderId
                )}`;
        }

        function viewBill(orderId) {
            window.location.href =
                `payment.html?orderId=${encodeURIComponent(
                    orderId
                )}`;
        }

        function openConfirmation(orderId) {
            window.location.href =
                `confirmation.html?orderId=${encodeURIComponent(
                    orderId
                )}`;
        }

        function raiseComplaint(orderId) {
            window.location.href =
                `complaints.html?orderId=${encodeURIComponent(
                    orderId
                )}`;
        }

        function formatItems(items) {
            if (Array.isArray(items)) {
                return items.join(", ");
            }

            return items || "-";
        }

        function formatDate(value) {
            if (!value) {
                return "-";
            }

            const date =
                new Date(value);

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {
                return value;
            }

            return date.toLocaleDateString(
                "en-IN"
            );
        }

        function normalizeStatus(status) {
            return String(status)
                .toLowerCase()
                .trim()
                .replaceAll("_", "-")
                .replaceAll(" ", "-");
        }

        function showOrderMessage(
            message,
            type
        ) {
            const box =
                document.getElementById(
                    "orderMessage"
                );

            box.textContent = message;

            box.className =
                `message ${type}`;
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            localStorage.removeItem("userId");

            window.location.href =
                "login.html";
        }
    </script>
</body>
</html>
