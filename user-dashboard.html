<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>User Dashboard | Hakuna Express</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f7fa;
            color: #333;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 16px 22px;
            color: white;
            background-color: #5c6bc0;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 24px;
        }

        header p {
            margin-top: 5px;
        }

        .logout-button {
            padding: 9px 15px;
            color: white;
            background-color: #d32f2f;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-button:hover {
            background-color: #b71c1c;
        }

        .page-container {
            width: calc(100% - 30px);
            max-width: 1180px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: start;
        }

        .card {
            padding: 24px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.09);
        }

        h2 {
            margin-bottom: 8px;
            color: #3f51b5;
        }

        .subtitle {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 5px;
            outline: none;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        textarea {
            min-height: 82px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #5c6bc0;
            box-shadow: 0 0 0 2px rgba(92, 107, 192, 0.15);
        }

        .two-column-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .assistant-row {
            display: flex;
            gap: 8px;
        }

        .assistant-row select {
            flex: 1;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .primary-button {
            color: white;
            background-color: #5c6bc0;
        }

        .success-button {
            color: white;
            background-color: #28a745;
        }

        .secondary-button {
            color: white;
            background-color: #6c757d;
        }

        .form-actions {
            display: flex;
            gap: 10px;
        }

        .form-actions button {
            flex: 1;
        }

        .message {
            min-height: 20px;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .error-message {
            color: #d32f2f;
        }

        .success-message {
            color: #2e7d32;
        }

        .loading-message {
            color: #3f51b5;
        }

        .booking-result {
            display: none;
            margin-top: 18px;
            padding: 16px;
            background-color: #edf7ee;
            border: 1px solid #b7d8ba;
            border-radius: 8px;
        }

        .booking-result p {
            margin: 7px 0;
        }

        .booking-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .booking-links a {
            padding: 9px 12px;
            color: white;
            background-color: #5c6bc0;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .booking-links a:first-child {
            background-color: #25d366;
        }

        .orders-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .orders-container {
            display: grid;
            gap: 14px;
        }

        .order-card {
            padding: 16px;
            background-color: #fafbff;
            border: 1px solid #ddd;
            border-radius: 9px;
        }

        .order-card h3 {
            margin-bottom: 8px;
            color: #3f51b5;
        }

        .order-card p {
            margin: 6px 0;
            line-height: 1.4;
            word-break: break-word;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 9px;
            color: #7a5400;
            background-color: #fff3cd;
            border-radius: 16px;
            font-size: 12px;
            font-weight: bold;
        }

        .order-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .order-actions button {
            color: white;
            background-color: #5c6bc0;
        }

        .empty-state {
            padding: 25px;
            color: #666;
            background-color: #f7f8fb;
            border-radius: 8px;
            text-align: center;
        }

        @media (max-width: 900px) {
            .page-container {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
            }

            .two-column-row {
                grid-template-columns: 1fr;
            }

            .assistant-row,
            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <div>
        <h1>Hakuna Express</h1>

        <p>
            Welcome,
            <strong id="userName">
                User
            </strong>
        </p>
    </div>

    <button
        type="button"
        class="logout-button"
        id="logoutButton"
    >
        Logout
    </button>
</header>

<main class="page-container">

    <section class="card">

        <h2>Place a New Order</h2>

        <p class="subtitle">
            Enter your shopping details and choose an available assistant.
        </p>

        <form id="shoppingForm" novalidate>

            <div class="form-group">
                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="address">
                    Complete Address
                </label>

                <textarea
                    id="address"
                    required
                ></textarea>
            </div>

            <div class="two-column-row">

                <div class="form-group">
                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="state">
                        State
                    </label>

                    <input
                        type="text"
                        id="state"
                        required
                    >
                </div>

            </div>

            <div class="form-group">

                <label for="assistantSelect">
                    Shopping Assistant
                </label>

                <div class="assistant-row">

                    <select
                        id="assistantSelect"
                        disabled
                        required
                    >
                        <option value="">
                            Enter city and state first
                        </option>
                    </select>

                    <button
                        type="button"
                        class="primary-button"
                        id="findAssistantsButton"
                    >
                        Find Assistants
                    </button>

                </div>

                <p
                    id="assistantMessage"
                    class="message"
                ></p>

            </div>

            <div class="two-column-row">

                <div class="form-group">
                    <label for="pincode">
                        Pincode
                    </label>

                    <input
                        type="text"
                        id="pincode"
                        maxlength="10"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        maxlength="15"
                        required
                    >
                </div>

            </div>

            <div class="two-column-row">

                <div class="form-group">
                    <label for="shoppingDate">
                        Shopping Date
                    </label>

                    <input
                        type="date"
                        id="shoppingDate"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="shoppingTime">
                        Shopping Time
                    </label>

                    <input
                        type="time"
                        id="shoppingTime"
                        required
                    >
                </div>

            </div>

            <div class="form-group">
                <label for="item">
                    Items
                </label>

                <textarea
                    id="item"
                    placeholder="Example: medicines, groceries, clothes"
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label for="language">
                    Preferred Language
                </label>

                <select
                    id="language"
                    required
                >
                    <option value="">
                        Select language
                    </option>

                    <option value="English">
                        English
                    </option>

                    <option value="Hindi">
                        Hindi
                    </option>

                    <option value="Telugu">
                        Telugu
                    </option>

                    <option value="Tamil">
                        Tamil
                    </option>

                    <option value="Kannada">
                        Kannada
                    </option>

                    <option value="Malayalam">
                        Malayalam
                    </option>

                    <option value="Marathi">
                        Marathi
                    </option>

                    <option value="Bengali">
                        Bengali
                    </option>
                </select>
            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="success-button"
                    id="submitButton"
                >
                    Place Order
                </button>

                <button
                    type="button"
                    class="secondary-button"
                    id="clearButton"
                >
                    Clear
                </button>

            </div>

        </form>

        <p
            id="formMessage"
            class="message"
            aria-live="polite"
        ></p>

        <div
            id="bookingResult"
            class="booking-result"
        >
            <h3>
                Order Placed Successfully
            </h3>

            <p>
                <strong>Order ID:</strong>
                <span id="resultOrderId"></span>
            </p>

            <p>
                <strong>Assistant:</strong>
                <span id="resultAssistantName"></span>
            </p>

            <p>
                <strong>Phone:</strong>
                <span id="resultAssistantPhone"></span>
            </p>

            <div class="booking-links">

                <a
                    id="whatsappLink"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    WhatsApp
                </a>

                <a href="orderUpdates.html">
                    Track Order
                </a>

                <a href="confirmation.html">
                    Confirm Delivery
                </a>

            </div>
        </div>

    </section>

    <section class="card">

        <div class="orders-header">

            <div>
                <h2>Your Existing Orders</h2>

                <p class="subtitle">
                    Your orders load automatically after login.
                </p>
            </div>

            <button
                type="button"
                class="primary-button"
                id="refreshOrdersButton"
            >
                Refresh
            </button>

        </div>

        <p
            id="ordersMessage"
            class="message"
            aria-live="polite"
        ></p>

        <div
            id="ordersContainer"
            class="orders-container"
        ></div>

    </section>

</main>

<script>
    const API_BASE_URL =
        "https://logistics-dwti.onrender.com";

    function getToken() {
        return localStorage.getItem(
            "token"
        );
    }

    function setMessage(
        elementId,
        message,
        type = ""
    ) {
        const element =
            document.getElementById(
                elementId
            );

        element.textContent = message;
        element.className = "message";

        if (type === "error") {
            element.classList.add(
                "error-message"
            );
        }

        if (type === "success") {
            element.classList.add(
                "success-message"
            );
        }

        if (type === "loading") {
            element.classList.add(
                "loading-message"
            );
        }
    }

    function escapeHtml(value) {
        const div =
            document.createElement("div");

        div.textContent =
            value === undefined ||
            value === null
                ? ""
                : String(value);

        return div.innerHTML;
    }

    function formatStatus(status) {
        if (!status) {
            return "Not available";
        }

        return String(status)
            .replaceAll("_", " ")
            .replace(
                /\b\w/g,
                function (letter) {
                    return letter.toUpperCase();
                }
            );
    }

    function formatDate(value) {
        if (!value) {
            return "Not available";
        }

        const date =
            new Date(value);

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {
            return String(value);
        }

        return date.toLocaleString();
    }

    function redirectToLogin() {
        localStorage.removeItem("token");
        localStorage.removeItem("userId");
        localStorage.removeItem("userName");
        localStorage.removeItem("username");
        localStorage.removeItem("email");
        localStorage.removeItem(
            "currentOrderId"
        );

        window.location.href =
            "login.html";
    }

    async function fetchUserInfo() {
        const token = getToken();

        if (!token) {
            redirectToLogin();
            return;
        }

        try {
            const response =
                await fetch(
                    `${API_BASE_URL}/me`,
                    {
                        headers: {
                            Authorization:
                                `Bearer ${token}`
                        }
                    }
                );

            const data =
                await response.json();

            if (
                response.status === 401 ||
                response.status === 403
            ) {
                redirectToLogin();
                return;
            }

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    "Unable to load user details."
                );
            }

            const user =
                data.user || {};

            document.getElementById(
                "userName"
            ).textContent =
                user.name ||
                localStorage.getItem(
                    "userName"
                ) ||
                "User";

            document.getElementById(
                "name"
            ).value =
                user.name || "";

            localStorage.setItem(
                "userName",
                user.name || ""
            );

        } catch (error) {
            console.error(
                "User details error:",
                error
            );
        }
    }

    function resetAssistantSelection() {
        const select =
            document.getElementById(
                "assistantSelect"
            );

        select.disabled = true;

        select.innerHTML = `
            <option value="">
                Enter city and state first
            </option>
        `;

        setMessage(
            "assistantMessage",
            ""
        );
    }

    async function loadAssistants() {
        const city =
            document
                .getElementById("city")
                .value
                .trim();

        const state =
            document
                .getElementById("state")
                .value
                .trim();

        const select =
            document.getElementById(
                "assistantSelect"
            );

        const button =
            document.getElementById(
                "findAssistantsButton"
            );

        if (!city || !state) {
            setMessage(
                "assistantMessage",
                "Please enter city and state.",
                "error"
            );

            return;
        }

        button.disabled = true;
        button.textContent =
            "Searching...";

        try {
            const url =
                `${API_BASE_URL}/assistants` +
                `?city=${encodeURIComponent(city)}` +
                `&state=${encodeURIComponent(state)}`;

            const response =
                await fetch(url);

            const data =
                await response.json();

            if (!response.ok) {
                setMessage(
                    "assistantMessage",
                    data.message ||
                    "Unable to load assistants.",
                    "error"
                );

                resetAssistantSelection();
                return;
            }

            const assistants =
                Array.isArray(
                    data.assistants
                )
                    ? data.assistants
                    : [];

            select.innerHTML = `
                <option value="">
                    Select an assistant
                </option>
            `;

            assistants.forEach(
                function (assistant) {
                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        assistant._id ||
                        assistant.id;

                    option.textContent =
                        `${assistant.name} - ` +
                        `${assistant.phonenumber}`;

                    select.appendChild(
                        option
                    );
                }
            );

            select.disabled =
                assistants.length === 0;

            if (assistants.length > 0) {
                setMessage(
                    "assistantMessage",
                    `${assistants.length} assistant(s) available.`,
                    "success"
                );
            } else {
                setMessage(
                    "assistantMessage",
                    "No available assistants found.",
                    "error"
                );
            }

        } catch (error) {
            console.error(
                "Assistant error:",
                error
            );

            setMessage(
                "assistantMessage",
                "Unable to connect to the server.",
                "error"
            );

        } finally {
            button.disabled = false;
            button.textContent =
                "Find Assistants";
        }
    }

    async function loadExistingOrders() {
        const token = getToken();

        if (!token) {
            redirectToLogin();
            return;
        }

        const container =
            document.getElementById(
                "ordersContainer"
            );

        const refreshButton =
            document.getElementById(
                "refreshOrdersButton"
            );

        container.innerHTML = "";

        refreshButton.disabled = true;

        setMessage(
            "ordersMessage",
            "Loading your orders...",
            "loading"
        );

        try {
            const response =
                await fetch(
                    `${API_BASE_URL}/my-orders`,
                    {
                        method: "GET",

                        headers: {
                            Authorization:
                                `Bearer ${token}`
                        }
                    }
                );

            const data =
                await response.json();

            if (
                response.status === 401 ||
                response.status === 403
            ) {
                redirectToLogin();
                return;
            }

            if (!response.ok) {
                setMessage(
                    "ordersMessage",
                    data.message ||
                    "Unable to load orders.",
                    "error"
                );

                return;
            }

            const orders =
                Array.isArray(data.orders)
                    ? data.orders
                    : [];

            if (orders.length === 0) {
                setMessage(
                    "ordersMessage",
                    ""
                );

                container.innerHTML = `
                    <div class="empty-state">
                        You have not placed any orders yet.
                    </div>
                `;

                return;
            }

            setMessage(
                "ordersMessage",
                `${orders.length} order${
                    orders.length === 1
                        ? ""
                        : "s"
                } found.`,
                "success"
            );

            orders.forEach(
                function (order) {
                    const card =
                        document.createElement(
                            "article"
                        );

                    card.className =
                        "order-card";

                    card.innerHTML = `
                        <h3>
                            ${escapeHtml(
                                order.item ||
                                "Order"
                            )}
                        </h3>

                        <p>
                            <strong>Order ID:</strong>
                            ${escapeHtml(order.id)}
                        </p>

                        <p>
                            <strong>Status:</strong>

                            <span class="status-badge">
                                ${escapeHtml(
                                    formatStatus(
                                        order.currentStatus
                                    )
                                )}
                            </span>
                        </p>

                        <p>
                            <strong>Shopping date:</strong>
                            ${escapeHtml(
                                formatDate(
                                    order.shoppingDate
                                )
                            )}
                        </p>

                        <p>
                            <strong>Shopping time:</strong>
                            ${escapeHtml(
                                order.shoppingTime
                            )}
                        </p>

                        <p>
                            <strong>Address:</strong>
                            ${escapeHtml(order.address)},
                            ${escapeHtml(order.city)},
                            ${escapeHtml(order.state)}
                            -
                            ${escapeHtml(order.pincode)}
                        </p>

                        <p>
                            <strong>Assistant:</strong>
                            ${escapeHtml(
                                order.assistant?.name ||
                                "Not assigned"
                            )}
                        </p>

                        <p>
                            <strong>Assistant phone:</strong>
                            ${escapeHtml(
                                order.assistant?.phonenumber ||
                                "Not available"
                            )}
                        </p>

                        <div class="order-actions">

                            <button
                                type="button"
                                data-track="${escapeHtml(
                                    order.id
                                )}"
                            >
                                Track
                            </button>

                            <button
                                type="button"
                                data-confirm="${escapeHtml(
                                    order.id
                                )}"
                            >
                                Confirm Delivery
                            </button>

                        </div>
                    `;

                    container.appendChild(
                        card
                    );
                }
            );

            container
                .querySelectorAll(
                    "[data-track]"
                )
                .forEach(
                    function (button) {
                        button.addEventListener(
                            "click",
                            function () {
                                localStorage.setItem(
                                    "currentOrderId",
                                    this.dataset.track
                                );

                                window.location.href =
                                    "orderUpdates.html";
                            }
                        );
                    }
                );

            container
                .querySelectorAll(
                    "[data-confirm]"
                )
                .forEach(
                    function (button) {
                        button.addEventListener(
                            "click",
                            function () {
                                localStorage.setItem(
                                    "currentOrderId",
                                    this.dataset.confirm
                                );

                                window.location.href =
                                    "confirmation.html";
                            }
                        );
                    }
                );

        } catch (error) {
            console.error(
                "Load orders error:",
                error
            );

            setMessage(
                "ordersMessage",
                "Unable to connect to the server.",
                "error"
            );

        } finally {
            refreshButton.disabled = false;
        }
    }

    document
        .getElementById("shoppingForm")
        .addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const token =
                    getToken();

                if (!token) {
                    redirectToLogin();
                    return;
                }

                const formData = {
                    name:
                        document
                            .getElementById("name")
                            .value
                            .trim(),

                    address:
                        document
                            .getElementById("address")
                            .value
                            .trim(),

                    city:
                        document
                            .getElementById("city")
                            .value
                            .trim(),

                    state:
                        document
                            .getElementById("state")
                            .value
                            .trim(),

                    assistantId:
                        document
                            .getElementById(
                                "assistantSelect"
                            )
                            .value,

                    pincode:
                        document
                            .getElementById("pincode")
                            .value
                            .trim(),

                    mobile:
                        document
                            .getElementById("mobile")
                            .value
                            .replace(/\D/g, ""),

                    item:
                        document
                            .getElementById("item")
                            .value
                            .trim(),

                    language:
                        document
                            .getElementById("language")
                            .value,

                    date:
                        document
                            .getElementById(
                                "shoppingDate"
                            )
                            .value,

                    time:
                        document
                            .getElementById(
                                "shoppingTime"
                            )
                            .value
                };

                if (
                    Object.values(formData)
                        .some(
                            function (value) {
                                return !value;
                            }
                        )
                ) {
                    setMessage(
                        "formMessage",
                        "Please fill all fields and select an assistant.",
                        "error"
                    );

                    return;
                }

                const submitButton =
                    document.getElementById(
                        "submitButton"
                    );

                submitButton.disabled = true;
                submitButton.textContent =
                    "Placing order...";

                document.getElementById(
                    "bookingResult"
                ).style.display =
                    "none";

                try {
                    const response =
                        await fetch(
                            `${API_BASE_URL}/submit-details`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json",

                                    Authorization:
                                        `Bearer ${token}`
                                },

                                body:
                                    JSON.stringify(
                                        formData
                                    )
                            }
                        );

                    const data =
                        await response.json();

                    if (
                        response.status === 401 ||
                        response.status === 403
                    ) {
                        redirectToLogin();
                        return;
                    }

                    if (!response.ok) {
                        setMessage(
                            "formMessage",
                            data.message ||
                            "Unable to place order.",
                            "error"
                        );

                        return;
                    }

                    const orderId =
                        data.order?.id || "";

                    localStorage.setItem(
                        "currentOrderId",
                        orderId
                    );

                    document.getElementById(
                        "resultOrderId"
                    ).textContent =
                        orderId ||
                        "Not available";

                    document.getElementById(
                        "resultAssistantName"
                    ).textContent =
                        data.assistant?.name ||
                        "Not available";

                    document.getElementById(
                        "resultAssistantPhone"
                    ).textContent =
                        data.assistant
                            ?.phonenumber ||
                        "Not available";

                    document.getElementById(
                        "whatsappLink"
                    ).href =
                        data.whatsappUrl ||
                        "#";

                    document.getElementById(
                        "bookingResult"
                    ).style.display =
                        "block";

                    setMessage(
                        "formMessage",
                        data.message ||
                        "Order placed successfully.",
                        "success"
                    );

                    await loadExistingOrders();

                } catch (error) {
                    console.error(
                        "Place order error:",
                        error
                    );

                    setMessage(
                        "formMessage",
                        "Unable to connect to the server.",
                        "error"
                    );

                } finally {
                    submitButton.disabled =
                        false;

                    submitButton.textContent =
                        "Place Order";
                }
            }
        );

    document
        .getElementById(
            "findAssistantsButton"
        )
        .addEventListener(
            "click",
            loadAssistants
        );

    document
        .getElementById(
            "refreshOrdersButton"
        )
        .addEventListener(
            "click",
            loadExistingOrders
        );

    document
        .getElementById("clearButton")
        .addEventListener(
            "click",
            function () {
                const savedName =
                    document
                        .getElementById("name")
                        .value;

                document
                    .getElementById(
                        "shoppingForm"
                    )
                    .reset();

                document.getElementById(
                    "name"
                ).value =
                    savedName;

                resetAssistantSelection();

                setMessage(
                    "formMessage",
                    ""
                );

                document.getElementById(
                    "bookingResult"
                ).style.display =
                    "none";
            }
        );

    document
        .getElementById("logoutButton")
        .addEventListener(
            "click",
            function () {
                const shouldLogout =
                    confirm(
                        "Are you sure you want to log out?"
                    );

                if (shouldLogout) {
                    redirectToLogin();
                }
            }
        );

    document
        .getElementById("city")
        .addEventListener(
            "input",
            resetAssistantSelection
        );

    document
        .getElementById("state")
        .addEventListener(
            "input",
            resetAssistantSelection
        );

    document.getElementById(
        "shoppingDate"
    ).min =
        new Date()
            .toISOString()
            .split("T")[0];

    document.addEventListener(
        "DOMContentLoaded",
        async function () {
            if (!getToken()) {
                redirectToLogin();
                return;
            }

            await fetchUserInfo();
            await loadExistingOrders();
        }
    );
</script>

</body>
</html>
