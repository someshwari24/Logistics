<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>User Dashboard | Hakuna Express</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f7fa;
            color: #333;
        }

        header {
            position: relative;
            padding: 18px 80px;
            color: white;
            text-align: center;
            background-color: #5c6bc0;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 28px;
        }

        .logout-btn {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            padding: 9px 16px;
            color: white;
            background-color: #d32f2f;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background-color: #b71c1c;
        }

        .dashboard-container {
            width: calc(100% - 30px);
            max-width: 620px;
            margin: 35px auto;
            padding: 28px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .welcome-message {
            margin-bottom: 8px;
            color: #3f51b5;
            text-align: center;
            font-size: 21px;
            font-weight: bold;
        }

        .description {
            margin-bottom: 25px;
            color: #666;
            text-align: center;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #bbb;
            border-radius: 5px;
            outline: none;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #5c6bc0;
            box-shadow: 0 0 0 2px rgba(92, 107, 192, 0.15);
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .assistant-search-row {
            display: flex;
            gap: 10px;
        }

        .assistant-search-row select {
            flex: 1;
        }

        .find-assistant-btn {
            padding: 10px 15px;
            color: white;
            background-color: #5c6bc0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
        }

        .find-assistant-btn:hover {
            background-color: #3f51b5;
        }

        .find-assistant-btn:disabled {
            background-color: #a7add4;
            cursor: not-allowed;
        }

        .assistant-search-message {
            min-height: 18px;
            margin-top: 7px;
            font-size: 13px;
        }

        .button-container {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .button {
            flex: 1;
            padding: 11px 18px;
            color: white;
            background-color: #28a745;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .button:hover {
            background-color: #218838;
        }

        .button:disabled {
            background-color: #94c6a0;
            cursor: not-allowed;
        }

        .cancel-btn {
            background-color: #dc3545;
        }

        .cancel-btn:hover {
            background-color: #c82333;
        }

        .message {
            min-height: 20px;
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .error-message {
            color: #d32f2f;
        }

        .success-message {
            color: #2e7d32;
        }

        .assistant-result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background-color: #edf7ee;
            border: 1px solid #b7d8ba;
            border-radius: 8px;
        }

        .assistant-result h3 {
            margin-bottom: 12px;
            color: #2e7d32;
        }

        .assistant-result p {
            margin: 7px 0;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .result-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .result-link {
            display: inline-block;
            padding: 10px 15px;
            color: white;
            background-color: #25d366;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .result-link:hover {
            opacity: 0.9;
        }

        .secondary-link {
            background-color: #5c6bc0;
        }

        .disabled-link {
            opacity: 0.6;
            pointer-events: none;
        }

        @media (max-width: 650px) {
            header {
                padding: 18px 15px 70px;
            }

            .logout-btn {
                top: auto;
                right: 50%;
                bottom: 15px;
                transform: translateX(50%);
            }

            .dashboard-container {
                margin: 20px auto;
                padding: 20px;
            }

            .form-row,
            .button-container,
            .assistant-search-row,
            .result-actions {
                flex-direction: column;
            }

            .result-link {
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>User Dashboard</h1>

    <button
        type="button"
        class="logout-btn"
        onclick="logout()"
    >
        Logout
    </button>
</header>

<main class="dashboard-container">

    <p class="welcome-message">
        Welcome, <span id="username">User</span>!
    </p>

    <p class="description">
        Enter your shopping details and select an available assistant.
    </p>

    <form id="shoppingForm" novalidate>

        <div class="form-group">
            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >
        </div>

        <div class="form-group">
            <label for="address">Complete Address</label>

            <textarea
                id="address"
                placeholder="Enter house number, street and locality"
                required
            ></textarea>
        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="city">City</label>

                <input
                    type="text"
                    id="city"
                    placeholder="Enter city"
                    required
                >
            </div>

            <div class="form-group">
                <label for="state">State</label>

                <input
                    type="text"
                    id="state"
                    placeholder="Enter state"
                    required
                >
            </div>

        </div>

        <div class="form-group">
            <label for="assistantSelect">
                Select Shopping Assistant
            </label>

            <div class="assistant-search-row">

                <select
                    id="assistantSelect"
                    required
                    disabled
                >
                    <option value="">
                        Enter city and state, then find assistants
                    </option>
                </select>

                <button
                    type="button"
                    class="find-assistant-btn"
                    id="findAssistantsButton"
                    onclick="loadAssistants()"
                >
                    Find Assistants
                </button>

            </div>

            <p
                id="assistantSearchMessage"
                class="assistant-search-message"
            ></p>
        </div>

        <div class="form-group">
            <label for="pincode">Pincode</label>

            <input
                type="text"
                id="pincode"
                inputmode="numeric"
                maxlength="6"
                placeholder="Enter 6-digit pincode"
                required
            >
        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="shopping-date">
                    Shopping Date
                </label>

                <input
                    type="date"
                    id="shopping-date"
                    required
                >
            </div>

            <div class="form-group">
                <label for="shopping-time">
                    Shopping Time
                </label>

                <input
                    type="time"
                    id="shopping-time"
                    required
                >
            </div>

        </div>

        <div class="form-group">
            <label for="mobile">Mobile Number</label>

            <input
                type="tel"
                id="mobile"
                inputmode="numeric"
                maxlength="10"
                placeholder="Enter 10-digit mobile number"
                required
            >
        </div>

        <div class="form-group">
            <label for="item">
                Items You Want to Purchase
            </label>

            <textarea
                id="item"
                placeholder="Example: Medicines, groceries, clothes"
                required
            ></textarea>
        </div>

        <div class="form-group">
            <label for="language">
                Preferred Language
            </label>

            <select id="language" required>
                <option value="">Select a language</option>
                <option value="English">English</option>
                <option value="Hindi">Hindi</option>
                <option value="Telugu">Telugu</option>
                <option value="Tamil">Tamil</option>
                <option value="Kannada">Kannada</option>
                <option value="Malayalam">Malayalam</option>
                <option value="Marathi">Marathi</option>
                <option value="Bengali">Bengali</option>
                <option value="Gujarati">Gujarati</option>
                <option value="Punjabi">Punjabi</option>
            </select>
        </div>

        <div class="button-container">

            <button
                type="submit"
                class="button"
                id="submitButton"
            >
                Book Assistant
            </button>

            <button
                type="button"
                class="button cancel-btn"
                onclick="cancelForm()"
            >
                Clear Form
            </button>

        </div>

    </form>

    <p
        id="formMessage"
        class="message"
        aria-live="polite"
    ></p>

    <section
        id="assistantResult"
        class="assistant-result"
    >
        <h3>Assistant Assigned Successfully</h3>

        <p>
            <strong>Order ID:</strong>
            <span id="resultOrderId"></span>
        </p>

        <p>
            <strong>Assistant:</strong>
            <span id="resultAssistantName"></span>
        </p>

        <p>
            <strong>Phone:</strong>
            <span id="resultAssistantPhone"></span>
        </p>

        <div class="result-actions">

            <a
                id="whatsappLink"
                class="result-link disabled-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                Contact on WhatsApp
            </a>

            <a
                href="orderUpdates.html"
                class="result-link secondary-link"
            >
                Track Order
            </a>

            <a
                href="confirmation.html"
                class="result-link secondary-link"
            >
                Confirm Delivery
            </a>

        </div>
    </section>

</main>

<script>
    const API_BASE_URL =
        "https://logistics-dwti.onrender.com";

    function showMessage(message, type) {
        const formMessage =
            document.getElementById("formMessage");

        formMessage.textContent = message;

        formMessage.className =
            type === "success"
                ? "message success-message"
                : "message error-message";
    }

    function redirectToLogin() {
        localStorage.removeItem("token");
        localStorage.removeItem("username");
        localStorage.removeItem("name");
        localStorage.removeItem("currentOrderId");

        window.location.href = "login.html";
    }

    async function fetchUserInfo() {
        const token = localStorage.getItem("token");

        if (!token) {
            redirectToLogin();
            return;
        }

        try {
            const response = await fetch(
                `${API_BASE_URL}/me`,
                {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message || "Session expired."
                );
            }

            /*
             * Supports both:
             * { name: "User" }
             * and
             * { user: { name: "User" } }
             */
            const userName =
                data.user?.name ||
                data.name ||
                localStorage.getItem("name") ||
                localStorage.getItem("username") ||
                "User";

            document.getElementById(
                "username"
            ).textContent = userName;

            document.getElementById(
                "name"
            ).value = userName;

        } catch (error) {
            console.error(
                "Fetch user information error:",
                error
            );

            alert(
                "Your session has expired. Please log in again."
            );

            redirectToLogin();
        }
    }

    function logout() {
        const confirmed = confirm(
            "Are you sure you want to log out?"
        );

        if (!confirmed) {
            return;
        }

        redirectToLogin();
    }

    function resetAssistantSelection() {
        const select =
            document.getElementById("assistantSelect");

        const message =
            document.getElementById(
                "assistantSearchMessage"
            );

        select.innerHTML = `
            <option value="">
                Enter city and state, then find assistants
            </option>
        `;

        select.disabled = true;
        message.textContent = "";
    }

    async function loadAssistants() {
        const city = document
            .getElementById("city")
            .value
            .trim();

        const state = document
            .getElementById("state")
            .value
            .trim();

        const select =
            document.getElementById("assistantSelect");

        const button =
            document.getElementById(
                "findAssistantsButton"
            );

        const message =
            document.getElementById(
                "assistantSearchMessage"
            );

        const token =
            localStorage.getItem("token");

        if (!city || !state) {
            message.textContent =
                "Please enter both city and state.";

            message.style.color = "#d32f2f";
            return;
        }

        if (!token) {
            redirectToLogin();
            return;
        }

        button.disabled = true;
        button.textContent = "Searching...";

        select.disabled = true;

        select.innerHTML = `
            <option value="">
                Searching assistants...
            </option>
        `;

        message.textContent = "";

        try {
            const url =
                `${API_BASE_URL}/assistants` +
                `?city=${encodeURIComponent(city)}` +
                `&state=${encodeURIComponent(state)}`;

            const response = await fetch(url, {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            });

            const data = await response.json();

            if (
                response.status === 401 ||
                response.status === 403
            ) {
                redirectToLogin();
                return;
            }

            if (!response.ok) {
                select.innerHTML = `
                    <option value="">
                        No assistants available
                    </option>
                `;

                message.textContent =
                    data.message ||
                    "No assistants found.";

                message.style.color = "#d32f2f";
                return;
            }

            const assistants =
                Array.isArray(data.assistants)
                    ? data.assistants
                    : [];

            if (assistants.length === 0) {
                select.innerHTML = `
                    <option value="">
                        No assistants available
                    </option>
                `;

                message.textContent =
                    "No available assistants found for this location.";

                message.style.color = "#d32f2f";
                return;
            }

            select.innerHTML = `
                <option value="">
                    Select an assistant
                </option>
            `;

            assistants.forEach((assistant) => {
                const option =
                    document.createElement("option");

                option.value =
                    assistant._id || assistant.id;

                option.textContent =
                    `${assistant.name} - ` +
                    `${assistant.phonenumber}`;

                select.appendChild(option);
            });

            select.disabled = false;

            message.textContent =
                `${assistants.length} assistant(s) available.`;

            message.style.color = "#2e7d32";

        } catch (error) {
            console.error(
                "Load assistants error:",
                error
            );

            select.innerHTML = `
                <option value="">
                    Unable to load assistants
                </option>
            `;

            message.textContent =
                "Unable to connect to the server.";

            message.style.color = "#d32f2f";

        } finally {
            button.disabled = false;
            button.textContent = "Find Assistants";
        }
    }

    function validateForm(data) {
        if (
            !data.name ||
            !data.address ||
            !data.city ||
            !data.state ||
            !data.assistantId ||
            !data.pincode ||
            !data.date ||
            !data.time ||
            !data.mobile ||
            !data.item ||
            !data.language
        ) {
            return "Please fill in all fields and select an assistant.";
        }

        if (!/^\d{6}$/.test(data.pincode)) {
            return "Pincode must contain exactly 6 digits.";
        }

        if (!/^\d{10}$/.test(data.mobile)) {
            return "Mobile number must contain exactly 10 digits.";
        }

        const selectedDateTime =
            new Date(`${data.date}T${data.time}`);

        if (
            Number.isNaN(
                selectedDateTime.getTime()
            )
        ) {
            return "Please select a valid shopping date and time.";
        }

        if (
            selectedDateTime.getTime() <=
            Date.now()
        ) {
            return "Shopping date and time must be in the future.";
        }

        return "";
    }

    document
        .getElementById("shoppingForm")
        .addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const token =
                    localStorage.getItem("token");

                if (!token) {
                    redirectToLogin();
                    return;
                }

                const formData = {
                    name: document
                        .getElementById("name")
                        .value
                        .trim(),

                    address: document
                        .getElementById("address")
                        .value
                        .trim(),

                    city: document
                        .getElementById("city")
                        .value
                        .trim(),

                    state: document
                        .getElementById("state")
                        .value
                        .trim(),

                    assistantId: document
                        .getElementById(
                            "assistantSelect"
                        )
                        .value,

                    pincode: document
                        .getElementById("pincode")
                        .value
                        .replace(/\D/g, ""),

                    date: document
                        .getElementById(
                            "shopping-date"
                        )
                        .value,

                    time: document
                        .getElementById(
                            "shopping-time"
                        )
                        .value,

                    mobile: document
                        .getElementById("mobile")
                        .value
                        .replace(/\D/g, ""),

                    item: document
                        .getElementById("item")
                        .value
                        .trim(),

                    language: document
                        .getElementById("language")
                        .value
                };

                const validationError =
                    validateForm(formData);

                if (validationError) {
                    showMessage(
                        validationError,
                        "error"
                    );

                    return;
                }

                const submitButton =
                    document.getElementById(
                        "submitButton"
                    );

                const resultSection =
                    document.getElementById(
                        "assistantResult"
                    );

                submitButton.disabled = true;

                submitButton.textContent =
                    "Booking assistant...";

                resultSection.style.display =
                    "none";

                showMessage("", "error");

                try {
                    const response = await fetch(
                        `${API_BASE_URL}/submit-details`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                Authorization:
                                    `Bearer ${token}`
                            },

                            body:
                                JSON.stringify(formData)
                        }
                    );

                    const data =
                        await response.json();

                    console.log(
                        "Booking API response:",
                        data
                    );

                    if (
                        response.status === 401 ||
                        response.status === 403
                    ) {
                        redirectToLogin();
                        return;
                    }

                    if (!response.ok) {
                        showMessage(
                            data.message ||
                            "Unable to create request.",
                            "error"
                        );

                        return;
                    }

                    /*
                     * Correct backend response:
                     *
                     * data.order.id
                     * data.assistant.name
                     * data.assistant.phonenumber
                     * data.whatsappUrl
                     */

                    const orderId =
                        data.order?.id || "";

                    const assistantName =
                        data.assistant?.name || "";

                    const assistantPhone =
                        data.assistant?.phonenumber || "";

                    const whatsappUrl =
                        data.whatsappUrl || "";

                    localStorage.setItem(
                        "currentOrderId",
                        orderId
                    );

                    document.getElementById(
                        "resultOrderId"
                    ).textContent =
                        orderId || "Not available";

                    document.getElementById(
                        "resultAssistantName"
                    ).textContent =
                        assistantName ||
                        "Not available";

                    document.getElementById(
                        "resultAssistantPhone"
                    ).textContent =
                        assistantPhone ||
                        "Not available";

                    const whatsappLink =
                        document.getElementById(
                            "whatsappLink"
                        );

                    if (whatsappUrl) {
                        whatsappLink.href =
                            whatsappUrl;

                        whatsappLink.classList.remove(
                            "disabled-link"
                        );

                        whatsappLink.textContent =
                            "Contact on WhatsApp";
                    } else {
                        whatsappLink.href = "#";

                        whatsappLink.classList.add(
                            "disabled-link"
                        );

                        whatsappLink.textContent =
                            "WhatsApp unavailable";
                    }

                    resultSection.style.display =
                        "block";

                    showMessage(
                        data.message ||
                        "Assistant assigned successfully.",
                        "success"
                    );

                    resultSection.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });

                } catch (error) {
                    console.error(
                        "Booking request error:",
                        error
                    );

                    showMessage(
                        "Unable to connect to the server.",
                        "error"
                    );

                } finally {
                    submitButton.disabled = false;

                    submitButton.textContent =
                        "Book Assistant";
                }
            }
        );

    function cancelForm() {
        const confirmed = confirm(
            "Clear all entered shopping details?"
        );

        if (!confirmed) {
            return;
        }

        const savedName =
            document.getElementById("name").value;

        document
            .getElementById("shoppingForm")
            .reset();

        document.getElementById(
            "name"
        ).value = savedName;

        resetAssistantSelection();

        document.getElementById(
            "assistantResult"
        ).style.display = "none";

        const whatsappLink =
            document.getElementById(
                "whatsappLink"
            );

        whatsappLink.href = "#";

        whatsappLink.classList.add(
            "disabled-link"
        );

        whatsappLink.textContent =
            "Contact on WhatsApp";

        showMessage("", "error");

        setMinimumShoppingDate();
    }

    function setMinimumShoppingDate() {
        const now = new Date();

        const localDate =
            new Date(
                now.getTime() -
                now.getTimezoneOffset() * 60000
            )
            .toISOString()
            .split("T")[0];

        document.getElementById(
            "shopping-date"
        ).min = localDate;
    }

    document
        .getElementById("city")
        .addEventListener(
            "input",
            resetAssistantSelection
        );

    document
        .getElementById("state")
        .addEventListener(
            "input",
            resetAssistantSelection
        );

    setMinimumShoppingDate();
    fetchUserInfo();
</script>

</body>
</html>
