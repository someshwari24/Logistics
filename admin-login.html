<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login | Hakuna Express</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#dbe8f7;min-height:100vh;display:grid;place-items:center;color:#333}
    .card{width:min(92%,400px);background:#fff;padding:30px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14)}
    h1{color:#3f51b5;text-align:center;margin-bottom:8px}
    .sub{text-align:center;color:#666;margin-bottom:24px}
    label{display:block;font-weight:bold;margin:14px 0 7px}
    input{width:100%;padding:11px;border:1px solid #bbb;border-radius:6px;font-size:15px}
    button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:6px;background:#3f51b5;color:#fff;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.65}
    #message{text-align:center;font-weight:bold;margin-top:15px;min-height:20px}
    .error{color:#d32f2f}.success{color:#2e7d32}
  </style>
</head>
<body>
  <main class="card">
    <h1>Admin Login</h1>
    <p class="sub">Hakuna Express Administration</p>

    <form id="adminLoginForm">
      <label for="email">Admin Email</label>
      <input type="email" id="email" required>

      <label for="password">Admin Password</label>
      <input type="password" id="password" required>

      <button type="submit" id="loginButton">Login</button>
    </form>

    <p id="message"></p>
  </main>

<script>
const API_BASE_URL = "https://logistics-dwti.onrender.com";

function showMessage(message, type = "") {
  const el = document.getElementById("message");
  el.textContent = message;
  el.className = type;
}

document.getElementById("adminLoginForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  const button = document.getElementById("loginButton");

  button.disabled = true;
  button.textContent = "Logging in...";
  showMessage("");

  try {
    const response = await fetch(`${API_BASE_URL}/admin-login`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({email, password})
    });

    const data = await response.json();

    if (!response.ok) {
      showMessage(data.message || "Admin login failed.", "error");
      return;
    }

    localStorage.setItem("adminToken", data.token);
    localStorage.setItem("adminEmail", data.admin?.email || email);

    showMessage("Login successful.", "success");
    window.location.href = "admin-dashboard.html";
  } catch (error) {
    console.error(error);
    showMessage("Unable to connect to the server.", "error");
  } finally {
    button.disabled = false;
    button.textContent = "Login";
  }
});
</script>
</body>
</html>
